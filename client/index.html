<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Believers' LoveWorld CM Kenya Zone is a Christ-centered digital ministry platform inspired by the principles of Christ Embassy and Pastor Chris Oyakhilome." />
    <meta name="theme-color" content="#0b0a14" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Believers' LoveWorld CM Kenya Zone</title>
    <style>
      /* Paints immediately from the raw HTML, before any JS downloads or
         runs, so there's no blank/white gap while the app boots — removed
         by App.jsx once React has actually mounted (see #boot-splash
         removal there). Deliberately has zero image/network dependencies
         (background is a pure CSS gradient, not a file) so it can never
         itself be the slow part. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(-45deg, #0d0c18, #1a1030, #2d1b4e, #170f2b, #0d0c18);
        background-size: 400% 400%;
        animation: boot-splash-gradient 8s ease infinite;
        transition: opacity 0.2s ease;
      }
      @keyframes boot-splash-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      #boot-splash svg {
        position: relative;
        animation: boot-splash-spin 1s linear infinite;
      }
      @keyframes boot-splash-spin {
        to { transform: rotate(360deg); }
      }
      #boot-splash.boot-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="17" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
        <path d="M37 20a17 17 0 0 0-17-17" stroke="#F2A31C" stroke-width="4" stroke-linecap="round" />
      </svg>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const isEditable = (target) => {
          const tag = target?.tagName?.toLowerCase();
          return target?.isContentEditable || tag === 'input' || tag === 'textarea' || tag === 'select';
        };

        const getReelsScroller = () => {
          const reel = document.querySelector('[data-reel]');
          return reel?.parentElement || null;
        };

        const getActiveReel = () => {
          const scroller = getReelsScroller();
          if (!scroller) return null;
          const rect = scroller.getBoundingClientRect();
          const center = rect.top + rect.height / 2;
          const cards = [...scroller.querySelectorAll('[data-reel]')];
          let best = null;
          let bestDistance = Infinity;
          for (const card of cards) {
            const cardRect = card.getBoundingClientRect();
            if (cardRect.bottom <= rect.top || cardRect.top >= rect.bottom) continue;
            const distance = Math.abs((cardRect.top + cardRect.height / 2) - center);
            if (distance < bestDistance) {
              best = card;
              bestDistance = distance;
            }
          }
          return best;
        };

        const scrollReel = (direction) => {
          const scroller = getReelsScroller();
          if (!scroller) return;
          const active = getActiveReel();
          const cards = [...scroller.querySelectorAll('[data-reel]')];
          const index = active ? cards.indexOf(active) : -1;
          const next = cards[index + direction];
          if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        const togglePlayback = () => {
          const active = getActiveReel();
          if (!active) return;
          const video = active.querySelector('video');
          if (video) {
            if (video.paused) video.play?.().catch(() => {});
            else video.pause?.();
            return;
          }
          const iframe = active.querySelector('iframe');
          if (!iframe) return;
          iframe.__blwPlaying = iframe.__blwPlaying === false;
          const func = iframe.__blwPlaying ? 'playVideo' : 'pauseVideo';
          iframe.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
        };

        const toggleMute = () => {
          const active = getActiveReel();
          if (!active) return;
          const button = active.querySelector('button[aria-label*="Mute video"], button[aria-label*="Unmute video"]');
          button?.click();
        };

        document.addEventListener('keydown', (event) => {
          const params = new URLSearchParams(window.location.search);
          const onReels = window.location.pathname === '/feed' && params.get('tab')?.toLowerCase() === 'reels';
          if (!onReels || isEditable(event.target) || event.metaKey || event.ctrlKey || event.altKey) return;

          if (event.key === 'ArrowDown') {
            event.preventDefault();
            scrollReel(1);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            scrollReel(-1);
          } else if (event.key === ' ' || event.code === 'Space') {
            event.preventDefault();
            togglePlayback();
          } else if (event.key.toLowerCase() === 'm') {
            event.preventDefault();
            toggleMute();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
