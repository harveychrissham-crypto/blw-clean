<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Believers' LoveWorld CM Kenya Zone is a Christ-centered digital ministry platform inspired by the principles of Christ Embassy and Pastor Chris Oyakhilome." />
    <meta name="theme-color" content="#0b0a14" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Believers' LoveWorld CM Kenya Zone</title>
    <style>
      /* Paints immediately from the raw HTML, before any JS downloads or
         runs, so there's no blank/white gap while the app boots — removed
         by App.jsx once React has actually mounted (see #boot-splash
         removal there). Deliberately has zero image/network dependencies
         (background is a pure CSS gradient, not a file) so it can never
         itself be the slow part. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(-45deg, #0d0c18, #1a1030, #2d1b4e, #170f2b, #0d0c18);
        background-size: 400% 400%;
        animation: boot-splash-gradient 8s ease infinite;
        transition: opacity 0.2s ease;
      }
      @keyframes boot-splash-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      #boot-splash svg {
        position: relative;
        animation: boot-splash-spin 1s linear infinite;
      }
      @keyframes boot-splash-spin {
        to { transform: rotate(360deg); }
      }
      #boot-splash.boot-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="17" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
        <path d="M37 20a17 17 0 0 0-17-17" stroke="#F2A31C" stroke-width="4" stroke-linecap="round" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
