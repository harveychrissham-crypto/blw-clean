<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Believers' LoveWorld CM Kenya Zone is a Christ-centered digital ministry platform inspired by the principles of Christ Embassy and Pastor Chris Oyakhilome." />
    <meta name="theme-color" content="#0b0a14" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Believers' LoveWorld CM Kenya Zone</title>
    <style>
      /*
        Animated boot splash inspired by the supplied reference:
        a dark navy field with slow, soft purple and electric-blue light
        waves moving through the frame. No logo or static image is placed
        over the animation so the gradient itself is the first app screen.
      */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #090813;
        opacity: 1;
        transition: opacity 0.6s ease;
        isolation: isolate;
      }

      #boot-splash::before,
      #boot-splash::after {
        content: "";
        position: absolute;
        inset: -35%;
        border-radius: 48%;
        filter: blur(28px);
        will-change: transform;
        pointer-events: none;
      }

      /* Broad purple light drifting from the left/bottom. */
      #boot-splash::before {
        background:
          radial-gradient(ellipse 38% 24% at 28% 72%, rgba(133, 38, 200, 0.72) 0%, rgba(104, 35, 165, 0.42) 38%, rgba(104, 35, 165, 0) 76%),
          radial-gradient(ellipse 28% 18% at 56% 54%, rgba(111, 38, 160, 0.20) 0%, rgba(111, 38, 160, 0) 72%);
        animation: boot-purple-wave 10s ease-in-out infinite alternate;
      }

      /* Thin blue-violet wave travelling along the lower-right edge. */
      #boot-splash::after {
        background:
          radial-gradient(ellipse 42% 11% at 72% 78%, rgba(0, 126, 255, 0.92) 0%, rgba(38, 82, 203, 0.62) 28%, rgba(45, 70, 180, 0.18) 53%, rgba(45, 70, 180, 0) 78%),
          radial-gradient(ellipse 26% 10% at 52% 85%, rgba(88, 45, 210, 0.40) 0%, rgba(88, 45, 210, 0) 74%);
        mix-blend-mode: screen;
        animation: boot-blue-wave 8s ease-in-out infinite alternate;
      }

      #boot-splash .wave {
        position: absolute;
        left: -18%;
        right: -18%;
        bottom: -10%;
        height: 38%;
        border-radius: 50% 50% 0 0;
        filter: blur(18px);
        will-change: transform;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      #boot-splash .wave-one {
        background: linear-gradient(90deg, rgba(104, 28, 181, 0), rgba(138, 37, 218, 0.35) 34%, rgba(28, 102, 247, 0.74) 72%, rgba(28, 102, 247, 0));
        transform: rotate(-8deg) translate3d(0, 7%, 0) scale(1.08);
        animation: boot-ribbon-one 9s ease-in-out infinite alternate;
      }

      #boot-splash .wave-two {
        height: 28%;
        bottom: 2%;
        background: linear-gradient(90deg, rgba(66, 26, 155, 0), rgba(113, 35, 203, 0.35) 26%, rgba(75, 55, 231, 0.55) 52%, rgba(0, 141, 255, 0.62) 78%, rgba(0, 141, 255, 0));
        transform: rotate(7deg) translate3d(0, 10%, 0) scale(1.1);
        animation: boot-ribbon-two 11s ease-in-out infinite alternate;
      }

      @keyframes boot-purple-wave {
        0%   { transform: translate3d(-3%, 5%, 0) scale(1.02); }
        100% { transform: translate3d(8%, -4%, 0) scale(1.10); }
      }

      @keyframes boot-blue-wave {
        0%   { transform: translate3d(8%, 4%, 0) rotate(-2deg) scale(1.02); }
        100% { transform: translate3d(-6%, -3%, 0) rotate(3deg) scale(1.10); }
      }

      @keyframes boot-ribbon-one {
        0%   { transform: rotate(-8deg) translate3d(-4%, 8%, 0) scale(1.08); }
        100% { transform: rotate(-3deg) translate3d(8%, -3%, 0) scale(1.16); }
      }

      @keyframes boot-ribbon-two {
        0%   { transform: rotate(7deg) translate3d(7%, 10%, 0) scale(1.10); }
        100% { transform: rotate(2deg) translate3d(-7%, -5%, 0) scale(1.17); }
      }

      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash::before,
        #boot-splash::after,
        #boot-splash .wave {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="wave wave-one"></div>
      <div class="wave wave-two"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
