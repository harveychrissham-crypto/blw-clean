<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Believers' LoveWorld CM Kenya Zone is a Christ-centered digital ministry platform inspired by the principles of Christ Embassy and Pastor Chris Oyakhilome." />
    <meta name="theme-color" content="#0d0c18" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Believers' LoveWorld CM Kenya Zone</title>
    <style>
      /*
        Boot splash: covers the gap between the WebView painting and React
        actually mounting (and, on native, the moment the static native
        splash image hands off to real content). Pure CSS so it can render
        before any JS has run. main.jsx fades and removes it once the app
        has mounted -- see hideBootSplash() there.
      */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #07060d;
        transition: opacity 0.5s ease;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .glow {
        position: absolute;
        width: 140vmax;
        height: 140vmax;
        border-radius: 50%;
        filter: blur(2px);
        will-change: transform;
      }
      #boot-splash .glow-purple {
        left: -55vmax;
        bottom: -60vmax;
        background: radial-gradient(circle at center, rgba(124,58,237,0.85) 0%, rgba(76,29,149,0.45) 32%, rgba(76,29,149,0) 62%);
        animation: boot-drift-a 9s ease-in-out infinite alternate;
      }
      #boot-splash .glow-blue {
        right: -55vmax;
        bottom: -68vmax;
        background: radial-gradient(circle at center, rgba(37,99,235,0.85) 0%, rgba(30,58,138,0.45) 32%, rgba(30,58,138,0) 62%);
        animation: boot-drift-b 11s ease-in-out infinite alternate;
      }
      @keyframes boot-drift-a {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(3vmax, -2vmax) scale(1.06); }
      }
      @keyframes boot-drift-b {
        0%   { transform: translate(0, 0) scale(1.04); }
        100% { transform: translate(-3vmax, -3vmax) scale(1); }
      }
      #boot-splash .badge {
        position: relative;
        width: min(46vmin, 260px);
        height: min(46vmin, 260px);
        object-fit: contain;
        filter: drop-shadow(0 0 32px rgba(247, 200, 120, 0.28));
        animation: boot-breathe 2.6s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .glow, #boot-splash .badge { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="glow glow-purple"></div>
      <div class="glow glow-blue"></div>
      <img class="badge" src="/logo-badge.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
