<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EMET is a Christ-centered social network built around truth, genuine connection, and community." />
    <meta name="theme-color" content="#02092b" />
    <link rel="icon" href="/emet-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <title>EMET</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #05091f;
        transition: opacity .24s ease;
        isolation: isolate;
      }
      #boot-splash::before {
        position: absolute;
        z-index: 0;
        inset: 0;
        content: "";
        pointer-events: none;
        background:
          radial-gradient(ellipse at 82% 8%, rgba(97, 66, 207, .34), transparent 42%),
          radial-gradient(ellipse at 10% 90%, rgba(24, 126, 191, .3), transparent 42%),
          radial-gradient(ellipse at 52% 42%, rgba(26, 42, 104, .22), transparent 58%),
          linear-gradient(145deg, #05091f 0%, #07152e 52%, #0d0a28 100%);
        background-size: 220% 220%;
        background-position: 0% 50%;
        animation: splash-gradient-drift 13s ease-in-out infinite alternate;
        will-change: background-position, filter;
      }
      #boot-splash::after {
        position: absolute;
        z-index: 0;
        inset: -18%;
        content: "";
        pointer-events: none;
        background: radial-gradient(ellipse at 15% 40%, rgba(34, 153, 190, .09), transparent 35%), radial-gradient(ellipse at 88% 58%, rgba(130, 79, 190, .11), transparent 38%);
        background-size: 180% 180%;
        animation: splash-orbs 16s ease-in-out infinite alternate;
        filter: blur(26px);
        will-change: background-position, transform;
      }
      #boot-splash .splash-brand {
        position: absolute;
        z-index: 2;
        top: 42%;
        left: 50%;
        display: flex;
        width: min(84vw, 440px);
        transform: translate(-50%, -50%);
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #boot-splash .splash-mark {
        display: block;
        width: clamp(132px, 20vh, 220px);
        height: clamp(132px, 20vh, 220px);
        filter: drop-shadow(0 12px 28px rgba(35, 91, 180, .18));
      }
      #boot-splash .splash-wordmark {
        display: block;
        width: min(76vw, 390px);
        height: auto;
        margin-top: 14px;
      }
      #boot-splash .splash-tagline {
        max-width: 430px;
        margin: 20px 0 0;
        color: rgba(237, 243, 255, .94);
        font: 400 clamp(18px, 3.3vw, 34px)/1.32 Inter, system-ui, sans-serif;
        letter-spacing: .015em;
      }

      #boot-splash .splash-wave { width: 104%;
        left: -2%;
        animation: splash-wave-drift 13s ease-in-out infinite alternate; will-change: transform; }
      #boot-splash .splash-wave path:first-child { opacity: .62; }
      #boot-splash .splash-wave path:last-child { opacity: .2; }


      @keyframes splash-gradient-drift {
        0% { background-position: 0% 50%; filter: hue-rotate(-4deg) saturate(1); }
        100% { background-position: 100% 50%; filter: hue-rotate(5deg) saturate(1.06); }
      }
      @keyframes splash-orbs {
        0% { background-position: 0% 50%; transform: translate3d(-1%, -1%, 0) scale(1); }
        100% { background-position: 100% 50%; transform: translate3d(1%, 1%, 0) scale(1.04); }
      }

      @media (max-height: 720px) {
        #boot-splash .splash-brand { top: 40%; }
        #boot-splash .splash-mark { width: clamp(110px, 17vh, 150px); height: clamp(110px, 17vh, 150px); }
        #boot-splash .splash-wordmark { margin-top: 10px; }
        #boot-splash .splash-tagline { margin-top: 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
  
      #boot-splash.boot-splash-hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
     <div class="splash-brand">
        <img class="splash-mark" src="/emet-mark.svg" width="250" height="250" alt="" />
        <img class="splash-wordmark" src="/emet-wordmark-geometric-white.svg" width="390" height="84" alt="EMET" />
        <p class="splash-tagline">Real People. Meaningful Connections.</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      setTimeout(() => {
        var root = document.getElementById('root');
        if (root && root.childElementCount > 0) return;
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        splash.innerHTML = '<div style="color:#fff;text-align:center;padding:0 32px;font-family:system-ui,sans-serif;">' +
          '<p style="font-weight:700;font-size:18px;margin:0 0 8px;">Taking longer than usual&hellip;</p>' +
          '<p style="opacity:.6;font-size:14px;margin:0 0 20px;">Check your connection, then try again.</p>' +
          '<button onclick="location.reload()" style="background:#3B82F6;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:14px;font-weight:700;">Retry</button>' +
          '</div>';
      }, 8000);
    </script>
    <script>
      (() => {
        const isEditable = (target) => {
          const tag = target?.tagName?.toLowerCase();
          return target?.isContentEditable || tag === 'input' || tag === 'textarea' || tag === 'select';
        };
        const getReelsScroller = () => { const reel = document.querySelector('[data-reel]'); return reel?.parentElement || null; };
        const getActiveReel = () => {
          const scroller = getReelsScroller();
          if (!scroller) return null;
          const rect = scroller.getBoundingClientRect();
          const center = rect.top + rect.height / 2;
          const cards = [...scroller.querySelectorAll('[data-reel]')];
          let best = null; let bestDistance = Infinity;
          for (const card of cards) {
            const cardRect = card.getBoundingClientRect();
            if (cardRect.bottom <= rect.top || cardRect.top >= rect.bottom) continue;
            const distance = Math.abs((cardRect.top + cardRect.height / 2) - center);
            if (distance < bestDistance) { best = card; bestDistance = distance; }
          }
          return best;
        };
        const scrollReel = (direction) => {
          const scroller = getReelsScroller(); if (!scroller) return;
          const active = getActiveReel(); const cards = [...scroller.querySelectorAll('[data-reel]')];
          const index = active ? cards.indexOf(active) : -1; const next = cards[index + direction];
          if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        const togglePlayback = () => {
          const active = getActiveReel(); if (!active) return;
          const video = active.querySelector('video');
          if (video) { if (video.paused) video.play?.().catch(() => {}); else video.pause?.(); return; }
          const iframe = active.querySelector('iframe'); if (!iframe) return;
          iframe.__blwPlaying = iframe.__blwPlaying === false;
          const func = iframe.__blwPlaying ? 'playVideo' : 'pauseVideo';
          iframe.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
        };
        const toggleMute = () => { const active = getActiveReel(); if (!active) return; active.querySelector('button[aria-label*="Mute video"], button[aria-label*="Unmute video"]')?.click(); };
        document.addEventListener('keydown', (event) => {
          const params = new URLSearchParams(window.location.search);
          const onReels = window.location.pathname === '/feed' && params.get('tab')?.toLowerCase() === 'reels';
          if (!onReels || isEditable(event.target) || event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.key === 'ArrowDown') { event.preventDefault(); scrollReel(1); }
          else if (event.key === 'ArrowUp') { event.preventDefault(); scrollReel(-1); }
          else if (event.key === ' ' || event.code === 'Space') { event.preventDefault(); togglePlayback(); }
          else if (event.key.toLowerCase() === 'm') { event.preventDefault(); toggleMute(); }
        });
      })();
    </script>
    <script>
      (() => {
        const attachHls = (video) => {
          if (!video || video.dataset.blwHlsAttached === '1') return;
          const source = video.currentSrc || video.src || video.getAttribute('src') || '';
          if (!source.includes('/manifest/video.m3u8')) return;
          video.dataset.blwHlsAttached = '1';
          if (video.canPlayType('application/vnd.apple.mpegurl')) return;
          if (!window.Hls?.isSupported?.()) return;
          const hls = new window.Hls({ enableWorker: true, lowLatencyMode: false });
          hls.loadSource(source);
          hls.attachMedia(video);
          video.__blwHls = hls;
        };
        const scan = () => document.querySelectorAll('video').forEach(attachHls);
        scan();
        new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
