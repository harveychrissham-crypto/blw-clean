name: Style meeting reactions like Google Meet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  style:
    if: ${{ !contains(github.event.head_commit.message, 'fix: style meeting reactions like Google Meet') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restyle meeting reactions
        shell: python
        run: |
          from pathlib import Path
          path = Path('client/src/pages/Meetings.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'className="mx-auto mt-3 flex w-fit items-center gap-2"': 'className="fixed bottom-24 left-1/2 z-30 flex w-fit -translate-x-1/2 items-center gap-2 rounded-full border border-white/10 bg-[#202124]/95 p-2 shadow-2xl backdrop-blur-md"',
            'className={`rounded-full border px-4 py-1.5 text-lg transition ${showPicker ? \'border-white/25 bg-white/15\' : \'border-white/10 bg-black/30 hover:bg-white/10\'}`}': 'className={`rounded-full border px-4 py-1.5 text-lg transition ${showPicker ? \'border-white/25 bg-white/15\' : \'border-white/10 bg-transparent hover:bg-white/10\'}`} ',
            'className="absolute bottom-0 text-2xl"': 'className="absolute bottom-0 text-2xl drop-shadow-lg"',
            'className="ml-1 rounded-full bg-black/50 px-2 py-0.5 align-middle text-[10px] text-white/80"': 'className="ml-1 rounded-full bg-[#202124]/90 px-2 py-0.5 align-middle text-[10px] text-white/80 backdrop-blur"',
            'className="mx-auto mt-3 w-fit rounded-full border border-amber-400/30 bg-amber-400/10 px-4 py-1.5 text-xs text-amber-200"': 'className="mx-auto mt-3 w-fit rounded-full border border-white/10 bg-[#202124]/90 px-4 py-1.5 text-xs text-white/80 backdrop-blur"',
            'className="absolute bottom-full left-1/2 z-40 mb-3 flex -translate-x-1/2 gap-1 rounded-full border border-white/10 bg-[#1a1926] p-1.5 shadow-2xl"': 'className="absolute bottom-full left-1/2 z-40 mb-3 flex -translate-x-1/2 gap-1 rounded-full border border-white/10 bg-[#202124] p-1.5 shadow-2xl backdrop-blur-md"',
            'className={`rounded-full border px-3 py-1.5 text-xs font-semibold ${handRaised ? \'border-amber-400/50 bg-amber-400/15 text-amber-200\' : \'border-white/15 bg-white/5 text-white/70 hover:bg-white/10\'}`}': 'className={`rounded-full border px-3 py-1.5 text-xs font-semibold ${handRaised ? \'border-white/30 bg-white/15 text-white\' : \'border-white/10 bg-transparent text-white/70 hover:bg-white/10\'}`} ',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Expected pattern not found: {old[:80]}')
            text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Meetings.jsx
          git rm .github/workflows/repair-meetings-google-meet-reactions.yml
          git commit -m "fix: style meeting reactions like Google Meet"
          git push