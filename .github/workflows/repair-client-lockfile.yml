name: Repair client lockfile

on:
  push:
    branches: [main]
    paths:
      - client/package.json
      - .github/workflows/repair-client-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate client lockfile
        run: npm install --prefix client --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- client/package-lock.json; then
            echo "Client lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git commit -m "chore: sync client package lockfile"
          git push
