name: Apply Google Meet meeting polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: apply Google Meet polish') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch meeting UI
        run: |
          python - <<'PY'
          from pathlib import Path

          meetings = Path('client/src/pages/Meetings.jsx')
          text = meetings.read_text()

          old = """    try {\n      const next = !sharing;\n      await roomRef.current?.localParticipant.setScreenShareEnabled(next);\n      setSharing(next);\n    } catch (e) {\n"""
          new = """    try {\n      const next = !sharing;\n      await roomRef.current?.localParticipant.setScreenShareEnabled(next, next ? {\n        audio: true,\n        contentHint: 'detail',\n        preferCurrentTab: false,\n        selfBrowserSurface: 'include',\n        surfaceSwitching: 'include',\n        systemAudio: 'include',\n        video: true,\n      } : undefined);\n      setSharing(next);\n    } catch (e) {\n"""
          if old not in text:\n              raise SystemExit('screen share block not found')\n          text = text.replace(old, new, 1)\n\n          old_label = 'label={screenShareSupported ? \'Present now\' : \'Present not supported\'}'\n          new_label = 'label={screenShareSupported ? \'Present\' : \'Present not supported\'}'\n          text = text.replace(old_label, new_label, 1)\n          old_more = "{screenShareSupported ? (sharing ? 'Stop presenting' : 'Present now') : 'Present not supported'}"\n          new_more = "{screenShareSupported ? (sharing ? 'Stop presenting' : 'Present screen, window or tab') : 'Present not supported'}"\n          text = text.replace(old_more, new_more, 1)\n\n          old_record = '<FiVideo className=\"h-3 w-3\" /> {busy === \'recording\' ? \'Updating…\' : recording ? \'Stop recording\' : \'Record meeting\'}'\n          new_record = '<FiVideo className=\"h-3 w-3\" /> {busy === \'recording\' ? \'Updating…\' : recording ? \'Stop recording\' : \'Record meeting\'}'\n          text = text.replace(old_record, new_record, 1)\n\n          meetings.write_text(text)\n          PY\n\n      - name: Commit polished meeting surface\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add client/src/pages/Meetings.jsx\n          git diff --cached --quiet && exit 0\n          git commit -m "feat: improve Meet screen sharing"\n          git push\n