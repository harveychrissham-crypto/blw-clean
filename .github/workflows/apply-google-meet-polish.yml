name: Apply Google Meet meeting polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: improve Meet screen sharing') && !startsWith(github.event.head_commit.message, 'chore: run duplicate control cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicate meeting controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/Meetings.jsx')
          s = p.read_text()

          old_leave = '<Button variant="custom" size="none" onClick={leaveVoluntarily} className="hidden shrink-0 items-center gap-2 rounded-full border border-white/10 px-4 py-2 text-sm sm:inline-flex"><FiLogOut/>Leave</Button>'
          if old_leave in s:
              s = s.replace(old_leave, '', 1)

          old_present = '<Button variant="custom" size="none" type="button" onClick={() => { toggleShare(); setShowMore(false); }} disabled={!screenShareSupported} className="flex w-full items-center gap-3 px-4 py-3 text-left text-sm text-white/85 hover:bg-white/5 disabled:text-white/30"><FiMonitor className="h-4 w-4 shrink-0"/><span className="flex-1">{screenShareSupported ? (sharing ? \'Stop presenting\' : \'Present screen, window or tab\') : \'Present not supported\'}</span>{sharing && <FiCheck className="h-4 w-4 shrink-0 text-amber-300"/>}</Button>'
          if old_present in s:
              s = s.replace(old_present, '', 1)

          p.write_text(s)
          PY

      - name: Commit duplicate-control fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Meetings.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: remove duplicate Meet controls"
          git push
