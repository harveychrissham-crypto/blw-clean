name: Apply Google Meet meeting polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: reliably remove duplicate Meet controls') && !startsWith(github.event.head_commit.message, 'fix: remove duplicate Meet controls') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate meeting controls
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('client/src/pages/Meetings.jsx')
          s = p.read_text()

          s, leave_count = re.subn(
              r'<Button[^>]*onClick=\{leaveVoluntarily\}[^>]*>\s*<FiLogOut\s*/>Leave</Button>',
              '',
              s,
              count=1,
              flags=re.S,
          )

          s, present_count = re.subn(
              r'<Button[^>]*onClick=\{\(\) => \{ toggleShare\(\); setShowMore\(false\); \}\}[^>]*>.*?Present screen, window or tab.*?</Button>',
              '',
              s,
              count=1,
              flags=re.S,
          )

          if leave_count == 0 and present_count == 0:
              print('No duplicate controls found; nothing to change.')
          else:
              print(f'Removed header leave={leave_count}, More-menu present={present_count}')
              p.write_text(s)
          PY

      - name: Commit duplicate-control fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Meetings.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: remove duplicate Meet controls"
          git push
