name: Fix Worker JWT signing mismatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-worker-jwt.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Patch Worker JWT handling and trigger Android build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/index.js')
          text = path.read_text()

          replacements = [
              (
                  "const currentSecret = typeof workerEnv.JWT_SECRET === 'string' && workerEnv.JWT_SECRET.trim() ? workerEnv.JWT_SECRET.trim() : '';\n  const candidateSecrets = [currentSecret, databaseUrl, `blw-leader-auth:${workerEnv.FELLOWSHIP_ADMIN_ACCESS_CODE || '1120363'}`].filter(Boolean);",
                  "const currentSecret = typeof workerEnv.JWT_SECRET === 'string' && workerEnv.JWT_SECRET.trim() ? workerEnv.JWT_SECRET.trim() : '';\n  if (!currentSecret) throw new Error('JWT_SECRET is required for authentication.');\n  const candidateSecrets = [currentSecret];",
              ),
              (
                  "const databaseUrl=workerEnv.HYPERDRIVE?.connectionString||workerEnv.DATABASE_URL||'',jwtSecret=workerEnv.JWT_SECRET||databaseUrl||'';",
                  "const databaseUrl=workerEnv.HYPERDRIVE?.connectionString||workerEnv.DATABASE_URL||'',jwtSecret=typeof workerEnv.JWT_SECRET==='string'&&workerEnv.JWT_SECRET.trim()?workerEnv.JWT_SECRET.trim():'';",
              ),
              (
                  "async function getExpressHandler(workerEnv){if(!expressHandlerPromise){expressHandlerPromise=(async()=>{process.env.CLOUDFLARE_WORKERS='true';const databaseUrl=workerEnv.HYPERDRIVE?.connectionString||workerEnv.DATABASE_URL||'',jwtSecret=workerEnv.JWT_SECRET||databaseUrl||'';",
                  "async function getExpressHandler(workerEnv){if(!expressHandlerPromise){expressHandlerPromise=(async()=>{process.env.CLOUDFLARE_WORKERS='true';const databaseUrl=workerEnv.HYPERDRIVE?.connectionString||workerEnv.DATABASE_URL||'',jwtSecret=typeof workerEnv.JWT_SECRET==='string'&&workerEnv.JWT_SECRET.trim()?workerEnv.JWT_SECRET.trim():'';if(!databaseUrl)throw new Error('HYPERDRIVE/DATABASE_URL is required for the API.');if(!jwtSecret)throw new Error('JWT_SECRET is required for the API.');",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          native = Path('client/src/native.js')
          ntext = native.read_text()
          marker = " * Keep this file in the Android release workflow's client path so merged FCM\n * fixes always produce a fresh APK for device verification.\n"
          if marker not in ntext:
              ntext = ntext.replace(" * backend associates each FCM token with the signed-in account.\n", " * backend associates each FCM token with the signed-in account.\n\n" + marker, 1)
              native.write_text(ntext)
          PY

      - name: Commit patched Worker and Android build trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js client/src/native.js
          git commit -m "Fix Worker JWT signing mismatch for push registration"
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-worker-jwt.yml
          git commit -m "Remove temporary Worker JWT fix workflow"
          git push origin HEAD:main
