name: Verify Cloudflare build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Feed JSX syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/Feed.jsx')
          text = path.read_text()
          broken = '</motion.div></AnimatePresence>}'
          fixed = '</motion.div>}</AnimatePresence>'
          if broken in text:
              path.write_text(text.replace(broken, fixed, 1))
              print('Repaired Feed JSX syntax.')
          else:
              print('Feed JSX syntax already repaired.')
          PY
          if ! git diff --quiet -- client/src/pages/Feed.jsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add client/src/pages/Feed.jsx
            git commit -m 'fix: repair Feed JSX syntax'
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install worker dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build client
        run: npm --prefix client run build

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/verify
