name: Add meeting PiP

on:
  push:
    paths:
      - '.github/workflows/add-pip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch meeting PiP
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/Meetings.jsx')
          s = p.read_text()

          old_state = "const [showMutedHint, setShowMutedHint] = useState(false); mutedHintTimer = useRef(null); const [copiedHint, setCopiedHint] = useState('');"
          # The actual source declares mutedHintTimer/copiedHintTimer with useRef; patch by inserting state before them.
          needle = "const [showMutedHint, setShowMutedHint] = useState(false);"
          if needle not in s:
              raise SystemExit('PiP state insertion point not found')
          s = s.replace(needle, needle + " const [pictureInPicture, setPictureInPicture] = useState(false);", 1)

          marker = "  const screenShareSupported = typeof navigator !== 'undefined' && Boolean(navigator.mediaDevices?.getDisplayMedia);"
          if marker not in s:
              raise SystemExit('screen share marker not found')
          pip_block = '''  const pictureInPictureSupported = typeof document !== 'undefined' && Boolean(document.pictureInPictureEnabled);
  useEffect(() => {
    const syncPictureInPicture = () => setPictureInPicture(Boolean(document.pictureInPictureElement));
    document.addEventListener('enterpictureinpicture', syncPictureInPicture);
    document.addEventListener('leavepictureinpicture', syncPictureInPicture);
    return () => {
      document.removeEventListener('enterpictureinpicture', syncPictureInPicture);
      document.removeEventListener('leavepictureinpicture', syncPictureInPicture);
    };
  }, []);
  const togglePictureInPicture = useCallback(async () => {
    if (!pictureInPictureSupported) {
      setError('Picture-in-Picture is not supported on this device.');
      return;
    }
    try {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
        return;
      }
      const videos = Array.from(containerRef.current?.querySelectorAll('video') || []);
      const target = videos.find((video) => !video.classList.contains('hidden') && video.readyState >= 2 && video.videoWidth > 0);
      if (!target || typeof target.requestPictureInPicture !== 'function') {
        setError('Turn a camera on or wait for a video to appear before using Picture-in-Picture.');
        return;
      }
      await target.requestPictureInPicture();
    } catch (e) {
      setError(e?.message || 'Unable to start Picture-in-Picture on this device.');
    }
  }, [pictureInPictureSupported]);
'''
          s = s.replace(marker, marker + "\n" + pip_block, 1)

          control_marker = '<ControlButton active={sharing} onClick={toggleShare} onIcon={FiMonitor} offIcon={FiMonitor} label={screenShareSupported ? \'Present\' : \'Present not supported\'} disabled={!screenShareSupported}/>'
          if control_marker not in s:
              raise SystemExit('Present control not found')
          pip_control = control_marker + '<ControlButton active={pictureInPicture} onClick={togglePictureInPicture} onIcon={FiVideo} offIcon={FiVideo} label={pictureInPictureSupported ? (pictureInPicture ? \'Exit Picture-in-Picture\' : \'Picture-in-Picture\') : \'Picture-in-Picture not supported\'} disabled={!pictureInPictureSupported}/>'
          s = s.replace(control_marker, pip_control, 1)

          p.write_text(s)

      - name: Install and build
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm --prefix client ci --no-audit --no-fund
          npm --prefix client run build

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-pip.yml
          git add client/src/pages/Meetings.jsx .github/workflows/add-pip.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add picture-in-picture to meetings'
          git push
