name: Build and Deploy BLW Kenya Zone

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'worker/**'
      - 'server/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        run: npm install --no-package-lock

      - name: Build client app
        run: npm run build

      - name: Ensure JWT_SECRET exists on the production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --name blw-kenya-zone --format json)"
          if ! printf '%s' "$secrets_json" | grep -q '"name"[[:space:]]*:[[:space:]]*"JWT_SECRET"'; then
            echo "JWT_SECRET is missing; creating a new production secret."
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET --name blw-kenya-zone
          else
            echo "JWT_SECRET is already configured on blw-kenya-zone."
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
