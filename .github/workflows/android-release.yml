name: Build & release Android APK

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (Run workflow button) without needing a push.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: client
        # Resolve the dependency tree from package.json instead of requiring
        # a pre-built lockfile. This lets CI pick up newly added packages.
        run: npm install --no-package-lock

      - name: Build web assets
        working-directory: client
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks

      - name: Write keystore.properties
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=app/release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_STORE_PASSWORD
          keyAlias=$ANDROID_KEYSTORE_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_KEY_PASSWORD
          EOF

      - name: Make gradlew executable
        working-directory: client/android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: client/android
        # versionCode must always increase for updates to install cleanly
        # over a previous version — the workflow run number is a simple,
        # always-increasing counter that works well for this.
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Rename APK for a stable download filename
        run: |
          mkdir -p dist-apk
          cp client/android/app/build/outputs/apk/release/app-release.apk \
             dist-apk/blw-campus-ministry.apk

      - name: Publish to the "latest-android" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-android
          name: Latest Android build
          body: |
            Automatically built from commit ${{ github.sha }}.
            Download link is stable — always points at the newest build:
            https://github.com/${{ github.repository }}/releases/download/latest-android/blw-campus-ministry.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: dist-apk/blw-campus-ministry.apk
          token: ${{ secrets.GITHUB_TOKEN }}
