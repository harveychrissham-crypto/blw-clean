name: Apply comment sheet drag patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Feed comment sheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('client/src/pages/Feed.jsx')
          s = p.read_text()
          marker = 'const [commentSheetDragY,setCommentSheetDragY]=useState(0);'
          if marker in s:
              print('Comment sheet drag patch already present')
          else:
              needle = 'function Comments({post,user,onUpdate,open,onClose}) {'
              if needle not in s:
                  raise SystemExit('Comments function not found')
              inject = '''function Comments({post,user,onUpdate,open,onClose}) { const [commentSheetDragY,setCommentSheetDragY]=useState(0); const commentSheetDrag=useRef(null); const onCommentSheetPointerDown=e=>{if(e.pointerType!=='touch')return;commentSheetDrag.current={startY:e.clientY,lastY:e.clientY,lastTime:performance.now()};e.currentTarget.setPointerCapture?.(e.pointerId);setCommentSheetDragY(0);}; const onCommentSheetPointerMove=e=>{const g=commentSheetDrag.current;if(!g||e.pointerType!=='touch')return;const delta=e.clientY-g.startY;const next=Math.max(0,delta);g.lastY=e.clientY;g.lastTime=performance.now();setCommentSheetDragY(next);}; const onCommentSheetPointerEnd=e=>{const g=commentSheetDrag.current;if(!g||e.pointerType!=='touch')return;const now=performance.now();const delta=Math.max(0,e.clientY-g.startY);const elapsed=Math.max(16,now-g.lastTime);const velocity=Math.max(0,(e.clientY-g.lastY)/elapsed);commentSheetDrag.current=null;if(delta>120||velocity>0.9){setCommentSheetDragY(0);onClose();}else{setCommentSheetDragY(0);}};'''
              s = s.replace(needle, inject, 1)
              pattern = r'''return <div className="fixed inset-0 z-\[80\] flex items-end justify-center bg-black/60 p-0 sm:p-6" onClick=\{onClose\}><motion\.div initial=\{\{y:'100%'\}\} animate=\{\{y:0\}\} onClick=\{e=>e\.stopPropagation\(\)\}'''
              repl = '''return <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/60 p-0 sm:p-6" onClick={onClose}><motion.div initial={{y:'100%'}} animate={{y:commentSheetDragY}} transition={{type:'spring',stiffness:420,damping:34}} onClick={e=>e.stopPropagation()} onPointerDown={onCommentSheetPointerDown} onPointerMove={onCommentSheetPointerMove} onPointerUp={onCommentSheetPointerEnd} onPointerCancel={onCommentSheetPointerEnd} style={{touchAction:'none'}}'''
              s2, n = re.subn(pattern, repl, s, count=1)
              if n != 1:
                  raise SystemExit('Comment sheet return wrapper not found')
              p.write_text(s2)
              print('Comment sheet drag patch applied')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-comment-sheet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Feed.jsx .github/workflows/patch-comment-sheet.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add drag-to-dismiss comment sheet"
          git push