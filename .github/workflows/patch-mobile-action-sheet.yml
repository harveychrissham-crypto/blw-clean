name: Patch mobile feed action sheet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-mobile-action-sheet.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch ActionMenu
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/Feed.jsx')
          s = p.read_text()
          start = s.index('function ActionMenu({post})')
          end = s.index('\nfunction useDoubleTap', start)
          old = s[start:end]
          new = '''function ActionMenu({post}) { const [open,setOpen]=useState(false); const [reporting,setReporting]=useState(false); const [reported,setReported]=useState(false); const menuRef=useRef(null); useEffect(()=>{if(!open)return;const onDoc=e=>{if(menuRef.current&&!menuRef.current.contains(e.target))setOpen(false);};const onKey=e=>{if(e.key==='Escape')setOpen(false);};document.addEventListener('pointerdown',onDoc);document.addEventListener('keydown',onKey);return()=>{document.removeEventListener('pointerdown',onDoc);document.removeEventListener('keydown',onKey);};},[open]); const copy=async()=>{try{await navigator.clipboard?.writeText(`${window.location.origin}/feed?${post.type==='reel'?'tab=Reels&':''}notificationId=${encodeURIComponent(post.id)}`);hapticSuccess();}catch{hapticError();}setOpen(false);}; const submitReport=async(reason)=>{try{await reportPost(post.id,reason);setReported(true);hapticSuccess();setTimeout(()=>{setOpen(false);setReporting(false);setReported(false);},1200);}catch{hapticError();}}; return <div ref={menuRef} className="relative"><button type="button" onClick={()=>setOpen(v=>!v)} className="grid h-9 w-9 place-items-center rounded-full text-white/45 hover:bg-white/[.06] active:scale-90" aria-label="More options"><FiMoreHorizontal/></button><AnimatePresence>{open&&<><motion.button type="button" aria-label="Close post options" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} onClick={()=>setOpen(false)} className="fixed inset-0 z-40 bg-black/45 sm:hidden"/><motion.div initial={{opacity:0,scale:.96,y:-4}} animate={{opacity:1,scale:1,y:0}} exit={{opacity:0,scale:.96,y:-4}} className="fixed inset-x-0 bottom-0 z-50 overflow-hidden rounded-t-3xl border border-white/10 bg-[#171526]/98 p-2 pb-[calc(.5rem+env(safe-area-inset-bottom))] shadow-2xl backdrop-blur-2xl sm:absolute sm:right-0 sm:top-10 sm:bottom-auto sm:z-30 sm:min-w-44 sm:rounded-xl sm:p-1 sm:pb-1">{reported ? <div className="px-3 py-6 text-center text-xs text-white/70">Thanks — this has been reported.</div> : reporting ? <div className="p-1"><div className="px-3 pb-2 pt-1 text-[11px] font-medium uppercase tracking-[.14em] text-white/35">Report post</div>{REPORT_REASONS.map(reason=><button key={reason} type="button" onClick={()=>submitReport(reason)} className="flex min-h-11 w-full items-center gap-2 rounded-xl px-3 py-2.5 text-left text-sm text-white/80 hover:bg-white/[.06] active:bg-white/[.1] sm:min-h-0 sm:rounded-lg sm:px-3 sm:py-2 sm:text-xs">{reason}</button>)}<button type="button" onClick={()=>setReporting(false)} className="mt-1 flex min-h-11 w-full items-center justify-center rounded-xl px-3 py-2.5 text-sm font-medium text-white/60 hover:bg-white/[.06] active:bg-white/[.1] sm:min-h-0 sm:rounded-lg sm:px-3 sm:py-2 sm:text-xs">Cancel</button></div> : <><div className="px-3 pb-2 pt-1 text-[11px] font-medium uppercase tracking-[.14em] text-white/35 sm:hidden">Post options</div><button type="button" onClick={copy} className="flex min-h-11 w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-white/80 hover:bg-white/[.06] active:bg-white/[.1] sm:min-h-0 sm:rounded-lg sm:px-3 sm:py-2 sm:text-xs"><FiLink2/>Copy link</button><button type="button" onClick={()=>{setReporting(true);hapticTap();}} className="flex min-h-11 w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-white/80 hover:bg-white/[.06] active:bg-white/[.1] sm:min-h-0 sm:rounded-lg sm:px-3 sm:py-2 sm:text-xs"><FiFlag/>Report</button></>}</motion.div></>}</AnimatePresence></div>; }'''
          if old == new:
              raise SystemExit('already patched')
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Verify client build
        run: npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Feed.jsx
          git commit -m "feat: add mobile feed action sheet" || true
          git rm .github/workflows/patch-mobile-action-sheet.yml
          git commit -m "chore: remove temporary mobile action sheet workflow"
          git push
