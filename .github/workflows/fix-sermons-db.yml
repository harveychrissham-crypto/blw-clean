name: Fix Sermons Database Handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          old = """  if (!url.pathname === '/api/sermons') return null;\n  if (!url.pathname.startsWith('/api/sermons')) return null;"""
          new = """  if (!url.pathname.startsWith('/api/sermons')) return null;"""
          if old in s:
              s = s.replace(old, new, 1)
          old = """    const result = await withDb(workerEnv, async (client) => {\n      await ensureSermonsTable(client);\n\n      if (request.method === 'GET' && id === null) {"""
          new = """    const result = await withDb(workerEnv, async (client) => {\n      // The sermons table is managed by the database migration, not by live API requests.\n      // Running CREATE/ALTER TABLE on every request can fail under restricted DB roles and\n      // turns a normal GET into a 503. The table and is_featured column already exist.\n      if (request.method === 'GET' && id === null) {"""
          if old not in s:
              raise SystemExit('Expected sermons handler block was not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git diff --cached --quiet || git commit -m "fix: stop running sermon DDL on API requests"
          git push
