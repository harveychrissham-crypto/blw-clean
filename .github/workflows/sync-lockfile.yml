name: Sync root npm lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-time Feed CI repair
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$(git log -1 --pretty=%s)" != "fix: trigger Feed CI repair" ]; then
            echo "Skipping one-time Feed repair"
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          feed = Path('client/src/pages/Feed.jsx')
          text = feed.read_text()
          bad = "const save=useCallback(()=>runAction('save',()=>toggleSave(post.id),()=>({saved:!post.saved,saveCount:Math.max(0,post.saveCount+(post.saved?-1:1)})),previous=>({saved:previous.saved,saveCount:previous.saveCount})),[runAction,post]);"
          good = "const save=useCallback(()=>runAction('save',()=>toggleSave(post.id),()=>({saved:!post.saved,saveCount:Math.max(0,post.saveCount+(post.saved?-1:1))}),previous=>({saved:previous.saved,saveCount:previous.saveCount})),[runAction,post]);"
          if bad in text:
              feed.write_text(text.replace(bad, good))

          worker = Path('worker/feed-api.js')
          text = worker.read_text()
          bad = "const updated = await client.query(`UPDATE public.feed_content_reports SET status='dismissed' WHERE id=$1 RETURNING id`);"
          good = "const updated = await client.query(`UPDATE public.feed_content_reports SET status='dismissed' WHERE id=$1 RETURNING id`,[reportId]);"
          if bad in text:
              worker.write_text(text.replace(bad, good))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Feed.jsx worker/feed-api.js
          git rm -f .github/workflows/repair-feed-failures.yml
          if git diff --cached --quiet; then
            echo "Feed repair already applied"
            exit 0
          fi
          git commit -m "fix: repair Feed CI regressions"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: sync package-lock.json with package.json"
          git push

# trigger one-time Feed repair
