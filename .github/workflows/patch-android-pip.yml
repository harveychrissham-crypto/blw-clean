name: Patch native Android meeting PiP

on:
  push:
    paths:
      - '.github/workflows/patch-android-pip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch meeting bridge and Android build
        shell: python
        run: |
          from pathlib import Path

          meetings = Path('client/src/pages/Meetings.jsx')
          s = meetings.read_text()

          react_import = "import { useCallback, useEffect, useRef, useState } from 'react';"
          if "import { registerPlugin } from '@capacitor/core';" not in s:
              if react_import not in s:
                  raise SystemExit('React import not found')
              s = s.replace(react_import, react_import + "\nimport { registerPlugin } from '@capacitor/core';", 1)

          marker = "const DEVICE_PREFS_KEY = 'blw-meet-device-prefs';"
          if "const MeetingPiP = registerPlugin('MeetingPiP');" not in s:
              if marker not in s:
                  raise SystemExit('device preference marker not found')
              s = s.replace(marker, marker + "\nconst MeetingPiP = registerPlugin('MeetingPiP');", 1)

          effect_marker = "  useEffect(() => () => { clearTimeout(mutedHintTimer.current); clearTimeout(copiedHintTimer.current); }, []);"
          pip_effect = "  useEffect(() => {\n    if (pending) return undefined;\n    MeetingPiP.setEnabled({ enabled: true }).catch(() => {});\n    return () => { MeetingPiP.setEnabled({ enabled: false }).catch(() => {}); };\n  }, [pending]);"
          if "MeetingPiP.setEnabled({ enabled: true })" not in s:
              if effect_marker not in s:
                  raise SystemExit('CallRoom lifecycle marker not found')
              s = s.replace(effect_marker, effect_marker + "\n" + pip_effect, 1)

          meetings.write_text(s)

          workflow = Path('.github/workflows/android-release.yml')
          w = workflow.read_text()
          sync_step = "      - name: Sync Capacitor Android project\n        working-directory: client\n        run: npx cap sync android\n"
          native_step = r'''      - name: Configure Android Picture-in-Picture for meetings
        working-directory: client/android
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="app/src/main/java/com/blwcampusministry/app/MainActivity.java"
          PIP_PLUGIN="app/src/main/java/com/blwcampusministry/app/MeetingPiP.java"
          MANIFEST="app/src/main/AndroidManifest.xml"

          cat > "$PIP_PLUGIN" <<'EOF'
          package com.blwcampusministry.app;

          import android.app.Activity;
          import android.app.PictureInPictureParams;
          import android.os.Build;
          import android.util.Rational;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "MeetingPiP")
          public class MeetingPiP extends Plugin {
            @PluginMethod
            public void setEnabled(PluginCall call) {
              boolean enabled = call.getBoolean("enabled", false);
              Activity activity = getActivity();
              activity.runOnUiThread(() -> {
                if (activity instanceof MainActivity) {
                  ((MainActivity) activity).setMeetingPipEnabled(enabled);
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                  PictureInPictureParams.Builder builder = new PictureInPictureParams.Builder()
                      .setAspectRatio(new Rational(16, 9));
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    builder.setAutoEnterEnabled(enabled);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    builder.setSeamlessResizeEnabled(true);
                  }
                  activity.setPictureInPictureParams(builder.build());
                }
                call.resolve(new JSObject().put("enabled", enabled));
              });
            }
          }
          EOF

          test -f "$MAIN_ACTIVITY"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/blwcampusministry/app/MainActivity.java')
          s = p.read_text()
          marker = 'public class MainActivity extends BridgeActivity {'
          if marker not in s:
              raise SystemExit('MainActivity class marker not found')
          if 'setMeetingPipEnabled' not in s:
              replacement = '''public class MainActivity extends BridgeActivity {
              private volatile boolean meetingPipEnabled = false;

              public void setMeetingPipEnabled(boolean enabled) {
                  meetingPipEnabled = enabled;
              }

              @Override
              protected void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(MeetingPiP.class);
              }

              @Override
              public void onUserLeaveHint() {
                  if (meetingPipEnabled && android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O && android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.S) {
                      enterPictureInPictureMode();
                  }
                  super.onUserLeaveHint();
              }'''
              s = s.replace(marker, replacement, 1)
              p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:supportsPictureInPicture="true"' not in s:
              old = 'android:exported="true"'
              idx = s.find(old)
              if idx < 0:
                  raise SystemExit('Main activity exported attribute not found')
              s = s[:idx] + s[idx:idx + len(old)] + ' android:supportsPictureInPicture="true" android:resizeableActivity="true"' + s[idx + len(old):]
              p.write_text(s)
          PY
'''
          if 'Configure Android Picture-in-Picture for meetings' not in w:
              if sync_step not in w:
                  raise SystemExit('Capacitor sync step not found')
              w = w.replace(sync_step, sync_step + native_step, 1)
          workflow.write_text(w)

          stale = Path('.github/workflows/add-pip.yml')
          if stale.exists():
              stale.unlink()

      - name: Validate patch inputs
        shell: bash
        run: |
          grep -q "MeetingPiP" client/src/pages/Meetings.jsx
          grep -q "Configure Android Picture-in-Picture for meetings" .github/workflows/android-release.yml

      - name: Commit patch and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-android-pip.yml
          git add client/src/pages/Meetings.jsx .github/workflows/android-release.yml .github/workflows/add-pip.yml .github/workflows/patch-android-pip.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: enable native Android meeting picture-in-picture'
          git push
