name: Fix meeting control visuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: dedupe meeting control visuals') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Meetings controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/pages/Meetings.jsx')
          s = path.read_text()

          old_import = 'FiUserPlus, FiUserCheck, FiVideo, FiClock'
          new_import = 'FiUserPlus, FiUserCheck, FiVideo, FiClock, FiSmile, FiArrowUp'
          if old_import in s and 'FiSmile, FiArrowUp' not in s:
              s = s.replace(old_import, new_import, 1)

          s = s.replace(
              'onIcon={FiUsers} offIcon={FiUsers} label="Raise hand"',
              'onIcon={FiArrowUp} offIcon={FiArrowUp} label="Raise hand"',
              1,
          )
          s = s.replace(
              'onIcon={FiMessageSquare} offIcon={FiMessageSquare} label="Reactions"',
              'onIcon={FiSmile} offIcon={FiSmile} label="Reactions"',
              1,
          )

          old_menu = 'className="absolute bottom-full right-0 z-40 mb-3 w-60 overflow-hidden rounded-2xl border border-white/10 bg-[#1a1926] shadow-2xl"'
          new_menu = 'className="fixed bottom-20 right-2 z-[60] mb-0 w-60 overflow-hidden rounded-2xl border border-white/10 bg-[#1a1926] shadow-2xl sm:bottom-24 sm:right-4"'
          if old_menu in s:
              s = s.replace(old_menu, new_menu, 1)

          path.write_text(s)

          print('Raise hand icon:', 'FiArrowUp' in s)
          print('Reactions icon:', 'FiSmile' in s)
          print('More menu fixed:', 'fixed bottom-20 right-2 z-[60]' in s)

      - name: Build client
        run: npm --prefix client run build

      - name: Commit and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-meeting-controls.yml
          git add client/src/pages/Meetings.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: dedupe meeting control visuals"
          git push
