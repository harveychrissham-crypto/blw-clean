name: Fix QR badge download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-qr-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch QR download handler
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/pages/Checkin.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const handleDownload = () => {\n    if (!canvasRef.current) return;\n    const link = document.createElement('a');\n    link.download = `${member.name.replace(/\\s+/g, '_')}_QR_Badge.png`;\n    link.href = canvasRef.current.toDataURL('image/png');\n    link.click();\n  };'''

          new = '''  const handleDownload = async () => {\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n\n    const safeName = String(member.name || 'Member')\n      .trim()\n      .replace(/[^a-z0-9]+/gi, '_')\n      .replace(/^_+|_+$/g, '') || 'Member';\n    const fileName = `${safeName}_QR_Badge.png`;\n\n    try {\n      const blob = await new Promise((resolve, reject) => {\n        canvas.toBlob((value) => (value ? resolve(value) : reject(new Error('Unable to create QR image.'))), 'image/png');\n      });\n      const url = URL.createObjectURL(blob);\n      const link = document.createElement('a');\n      link.href = url;\n      link.download = fileName;\n      link.rel = 'noopener';\n      link.style.display = 'none';\n      document.body.appendChild(link);\n      link.click();\n      link.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 1500);\n      return;\n    } catch {\n      // Fall through to the Android/browser share fallback.\n    }\n\n    try {\n      const dataUrl = canvas.toDataURL('image/png');\n      const response = await fetch(dataUrl);\n      const blob = await response.blob();\n      const file = new File([blob], fileName, { type: 'image/png' });\n\n      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {\n        await navigator.share({\n          title: `${member.name} QR Badge`,\n          text: `BLW Campus Ministry QR badge for ${member.name}`,\n          files: [file],\n        });\n        return;\n      }\n\n      const imageUrl = URL.createObjectURL(blob);\n      const popup = window.open(imageUrl, '_blank', 'noopener,noreferrer');\n      if (!popup) window.location.href = imageUrl;\n      setTimeout(() => URL.revokeObjectURL(imageUrl), 10000);\n    } catch (error) {\n      console.error('Unable to download/share QR badge:', error);\n    }\n  };'''

          if old not in text:
              raise SystemExit('Expected QR download handler was not found; no changes made.')

          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit QR fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Checkin.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: make QR badge download work on Android and web"
          git push
