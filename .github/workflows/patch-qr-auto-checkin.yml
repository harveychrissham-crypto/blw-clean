name: Patch QR Auto Check-In

on:
  push:
    paths-ignore:
      - 'client/src/pages/LeadersForum.jsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch scanner flow
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/pages/LeadersForum.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const handleScannedData = useCallback(async (raw) => {
    stopCamera();
    const parsed = parseQRPayload(raw);
    if (!parsed) { setError('Invalid QR code — not a recognised BLW member badge.'); return; }
    try {
      const matches = await searchMembers(parsed.membershipId);
      const member = matches.find((m) => m.membershipId === parsed.membershipId) || matches[0];
      if (!member) { setError(`Scanned: "${parsed.name}" (${parsed.membershipId}) — not found in registry.`); return; }
      setResult({ member });
    } catch (err) {
      setError(`Scanned: "${parsed.name}" (${parsed.membershipId}) — not found in registry.`);
    }
  }, [stopCamera]);'''

          new = '''  const handleScannedData = useCallback(async (raw) => {
    stopCamera();
    const parsed = parseQRPayload(raw);
    if (!parsed) { setError('Invalid QR code — not a recognised BLW member badge.'); return; }

    // QR badges contain the exact membership ID, so attendance can be recorded
    // immediately without a second confirmation click. The check-in helper
    // queues the record locally when the device is offline and syncs later.
    try {
      if (!navigator.onLine) {
        const localMember = members.find((m) => m.membershipId === parsed.membershipId) || {
          membershipId: parsed.membershipId,
          name: parsed.name,
          phone: parsed.phone,
          email: parsed.email,
        };
        const updated = await onCheckIn(parsed.membershipId);
        setResult({
          member: { ...localMember, ...updated, checkedIn: true },
          confirmed: true,
          offlineQueued: true,
        });
        return;
      }

      const matches = await searchMembers(parsed.membershipId);
      const member = matches.find((m) => m.membershipId === parsed.membershipId) || matches[0];
      if (!member) { setError(`Scanned: "${parsed.name}" (${parsed.membershipId}) — not found in registry.`); return; }

      const updated = await onCheckIn(member.membershipId);
      setResult({ member: { ...member, ...updated, checkedIn: true }, confirmed: true });
    } catch (err) {
      setError(err.message || `Unable to sign in "${parsed.name}" right now.`);
    }
  }, [stopCamera, members, onCheckIn]);'''

          if old not in text:
              raise SystemExit('Expected QR scanner block was not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit patched scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/LeadersForum.jsx
          if git diff --cached --quiet; then
            echo "No scanner patch needed."
            exit 0
          fi
          git commit -m "Make QR scans immediately sign in members"
          git push
