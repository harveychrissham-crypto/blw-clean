name: Fix meeting UX v2

on:
  push:
    paths:
      - '.github/workflows/fix-meeting-ux-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch meeting UX
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/Meetings.jsx')
          s = p.read_text()

          replacements = [
            (
              "FiCamera, FiCameraOff, FiMic, FiMicOff, FiMonitor, FiUsers, FiCopy, FiPlus, FiPhoneOff,",
              "FiCamera, FiCameraOff, FiMic, FiMicOff, FiMonitor, FiUsers, FiCopy, FiPlus, FiPhoneOff, FiAlertTriangle,",
            ),
            (
              "const REACTION_EMOJIS = ['👍', '❤️', '🎉', '👏', '😂', '😮', '🙏'];\nconst DEVICE_PREFS_KEY",
              "const REACTION_EMOJIS = ['👍', '❤️', '🎉', '👏', '😂', '😮', '🙏'];\nconst ROOM_CODE_WORDS = ['faith', 'grace', 'hope', 'joy', 'peace', 'praise', 'light', 'victory', 'wisdom', 'purpose'];\nfunction generateRoomName() {\n  const word = ROOM_CODE_WORDS[Math.floor(Math.random() * ROOM_CODE_WORDS.length)];\n  const number = String(Math.floor(1000 + Math.random() * 9000));\n  return `fellowship-${word}-${number}`;\n}\nconst DEVICE_PREFS_KEY",
            ),
            (
              "body: JSON.stringify({ name: `fellowship-${Date.now().toString(36)}` })",
              "body: JSON.stringify({ name: generateRoomName() })",
            ),
            (
              "const [busy, setBusy] = useState(''); const [notice, setNotice] = useState(''); const [log, setLog] = useState([]); const [recordings, setRecordings] = useState([]);",
              "const [busy, setBusy] = useState(''); const [notice, setNotice] = useState(''); const [log, setLog] = useState([]); const [recordings, setRecordings] = useState([]); const [confirmEnd, setConfirmEnd] = useState(false);",
            ),
            (
              "const endForEveryone = async () => { if (!window.confirm('End this meeting for everyone? All participants will be disconnected.')) return; setBusy('end'); setNotice(''); try { const response = await apiFetch(`/api/video/rooms/${encodeURIComponent(roomName)}`, { method: 'DELETE' }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body?.error || 'Unable to end the meeting.'); onEnded(); } catch (err) { setNotice(err?.message || 'Unable to end the meeting.'); setBusy(''); } };",
              "const endForEveryone = async () => { setBusy('end'); setNotice(''); try { const response = await apiFetch(`/api/video/rooms/${encodeURIComponent(roomName)}`, { method: 'DELETE' }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body?.error || 'Unable to end the meeting.'); onEnded(); } catch (err) { setNotice(err?.message || 'Unable to end the meeting.'); setBusy(''); } finally { setConfirmEnd(false); } };",
            ),
            (
              "onClick={endForEveryone}",
              "onClick={() => setConfirmEnd(true)}",
            ),
            (
              "<div className=\"fixed bottom-24 left-1/2 z-50 -translate-x-1/2 rounded-full border border-white/10 bg-[#202124]/95 px-4 py-1.5 text-xs text-white/80 shadow-lg backdrop-blur\">🔇 You are muted</div>",
              "<div className=\"fixed bottom-24 left-1/2 z-50 inline-flex -translate-x-1/2 items-center gap-2 rounded-full border border-white/10 bg-[#202124]/95 px-4 py-1.5 text-xs text-white/80 shadow-lg backdrop-blur\"><FiMicOff className=\"h-3.5 w-3.5\"/>You are muted</div>",
            ),
            (
              "<div className=\"fixed bottom-24 left-1/2 z-50 -translate-x-1/2 rounded-full border border-emerald-400/20 bg-[#202124]/95 px-4 py-1.5 text-xs text-emerald-200 shadow-lg backdrop-blur\">✅ {copiedHint}</div>",
              "<div className=\"fixed bottom-24 left-1/2 z-50 inline-flex -translate-x-1/2 items-center gap-2 rounded-full border border-emerald-400/20 bg-[#202124]/95 px-4 py-1.5 text-xs text-emerald-200 shadow-lg backdrop-blur\"><FiCheck className=\"h-3.5 w-3.5\"/>{copiedHint}</div>",
            ),
            (
              "<div className=\"fixed bottom-24 left-1/2 z-40 -translate-x-1/2 rounded-full border border-pink-400/25 bg-[#1a1926]/90 px-4 py-1.5 text-xs text-pink-200 shadow-lg backdrop-blur\">✋ {raisedList.join(', ')} raised {raisedList.length === 1 ? 'a hand' : 'hands'}</div>",
              "<div className=\"fixed bottom-24 left-1/2 z-40 inline-flex -translate-x-1/2 items-center gap-2 rounded-full border border-pink-400/25 bg-[#1a1926]/90 px-4 py-1.5 text-xs text-pink-200 shadow-lg backdrop-blur\"><FiArrowUp className=\"h-3.5 w-3.5\"/>{raisedList.join(', ')} raised {raisedList.length === 1 ? 'a hand' : 'hands'}</div>",
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected source fragment: {old[:90]}')
            s = s.replace(old, new)

          modal = "{confirmEnd && <div className=\"fixed inset-0 z-[80] grid place-items-center bg-black/70 p-4 backdrop-blur-sm\" role=\"presentation\"><Card variant=\"custom\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"end-meeting-title\" className=\"w-full max-w-sm rounded-3xl border border-white/10 bg-[#1a1926] p-5 shadow-2xl\"><div className=\"flex items-start gap-3\"><div className=\"grid h-10 w-10 shrink-0 place-items-center rounded-full bg-red-500/10 text-red-300\"><FiAlertTriangle/></div><div><h2 id=\"end-meeting-title\" className=\"text-base font-semibold text-white\">End meeting for everyone?</h2><p className=\"mt-1 text-sm leading-5 text-white/55\">Everyone in this meeting will be disconnected. This cannot be undone.</p></div></div><div className=\"mt-5 flex justify-end gap-2\"><Button variant=\"custom\" size=\"none\" type=\"button\" onClick={() => setConfirmEnd(false)} disabled={busy === 'end'} className=\"rounded-xl border border-white/10 px-4 py-2.5 text-sm font-semibold text-white/70 hover:bg-white/5\">Cancel</Button><Button variant=\"custom\" size=\"none\" type=\"button\" onClick={endForEveryone} disabled={busy === 'end'} className=\"rounded-xl bg-red-500 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-400 disabled:opacity-50\">{busy === 'end' ? 'Ending…' : 'End meeting'}</Button></div></Card></div>}"
          card_close = "</Card>; }"
          idx = s.rfind(card_close)
          if idx < 0:
            raise SystemExit('Could not locate final HostPanel card close')
          s = s[:idx] + modal + s[idx:]
          p.write_text(s)
      - name: Verify source changes
        shell: bash
        run: |
          grep -F "generateRoomName()" client/src/pages/Meetings.jsx
          grep -F "confirmEnd" client/src/pages/Meetings.jsx
          ! grep -F "window.confirm" client/src/pages/Meetings.jsx
          ! grep -F "🔇 You are muted" client/src/pages/Meetings.jsx
          ! grep -F "✅ {copiedHint}" client/src/pages/Meetings.jsx
          ! grep -F "✋ {raisedList.join" client/src/pages/Meetings.jsx
      - name: Commit and clean up
        shell: bash
        run: |
          rm -f .github/workflows/fix-meeting-ux.yml .github/workflows/fix-meeting-ux-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Meetings.jsx .github/workflows/fix-meeting-ux.yml .github/workflows/fix-meeting-ux-v2.yml
          git commit -m 'fix: polish meeting confirmation, room codes, and notices'
          git push
