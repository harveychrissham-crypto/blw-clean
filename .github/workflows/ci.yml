name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'worker/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-package-lock --ignore-scripts

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Syntax-check server and worker JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find server worker -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
