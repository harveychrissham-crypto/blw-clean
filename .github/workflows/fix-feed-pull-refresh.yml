name: Fix Feed pull refresh

on:
  push:
    paths:
      - '.github/workflows/fix-feed-pull-refresh.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Feed pull refresh wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/Feed.jsx')
          s = p.read_text()
          old = "const {pullDistance,isRefreshing:pullRefreshing,bindHandlers}=usePullToRefresh(async()=>load({refresh:true})); return <div className=\"min-h-screen bg-[#0d0b17] text-white\"><motion.div animate={refreshing||pullRefreshing ? { rotate: 360 } : { rotate: 0 }} transition={refreshing||pullRefreshing ? { repeat: Infinity, duration: 0.85, ease: \"linear\" } : { duration: 0.2 }}><motion.div animate={(refreshing||pullRefreshing)?{rotate:360}:{rotate:Math.min(pullDistance*3.2,180)}} transition={(refreshing||pullRefreshing)?{repeat:Infinity,duration:0.85,ease:\"linear\"}:{duration:0.12}}><PullToRefreshIndicator distance={pullDistance} refreshing={refreshing||pullRefreshing}/></motion.div></motion.div><main"
          new = "const {pullDistance,refreshing:pullRefreshing,bind}=usePullToRefresh(async()=>load({refresh:true})); return <div className=\"min-h-screen bg-[#0d0b17] text-white\"><PullToRefreshIndicator pullDistance={pullDistance} refreshing={refreshing||pullRefreshing}/><main"
          if old not in s:
              raise SystemExit('Expected pull refresh wiring was not found')
          s = s.replace(old, new, 1)
          old2 = "<div {...bindHandlers} className=\"space-y-4\">"
          new2 = "<div {...bind} className=\"space-y-4\">"
          if old2 not in s:
              raise SystemExit('Expected pull refresh bind usage was not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Build client
        run: npm --prefix client install && npm --prefix client run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Feed.jsx
          git commit -m 'fix: wire Instagram-style pull refresh spinner'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/fix-feed-pull-refresh.yml
          git add .github/workflows/fix-feed-pull-refresh.yml
          git commit -m 'chore: remove temporary pull refresh workflow'
          git push
