name: Patch Feed Following dependency

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Feed.jsx
        shell: python
        run: |
          from pathlib import Path
          path = Path('client/src/pages/Feed.jsx')
          text = path.read_text()
          text = text.replace("writeCachedFeed(normalized);}}catch(e)", "if(tab==='All')writeCachedFeed(normalized);}}catch(e)", 1)
          text = text.replace("}},[]);\n  const loadMore=useCallback", "}},[tab]);\n  const loadMore=useCallback", 1)
          path.write_text(text)
