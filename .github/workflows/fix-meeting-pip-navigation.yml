name: Finalize persistent meeting PiP

on:
  push:
    paths:
      - '.github/workflows/fix-meeting-pip-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path

          p = Path('client/src/pages/Meetings.jsx')
          s = p.read_text()
          s = s.replace(
              "import { useCallback, useEffect, useRef, useState } from 'react';",
              "import { useCallback, useEffect, useRef, useState } from 'react';\nimport { registerPlugin } from '@capacitor/core';",
              1,
          ) if "import { registerPlugin } from '@capacitor/core';" not in s else s
          if "const MeetingPiP = registerPlugin('MeetingPiP');" not in s:
              s = s.replace("const DEVICE_PREFS_KEY = 'blw-meet-device-prefs';", "const DEVICE_PREFS_KEY = 'blw-meet-device-prefs';\nconst MeetingPiP = registerPlugin('MeetingPiP');\nconst MEETING_SESSION_EVENT = 'blw-meeting-session-change';\nfunction publishMeetingSession(session) { try { window.__BLW_MEETING_SESSION__ = session; window.dispatchEvent(new Event(MEETING_SESSION_EVENT)); } catch {} }", 1)
          s = s.replace('function CallRoom({ credentials, choices, room: roomName, onLeave }) {', 'export function CallRoom({ credentials, choices, room: roomName, onLeave }) {', 1)
          if 'MeetingPiP.setEnabled({ enabled: true })' not in s:
              marker = "  useEffect(() => () => { clearTimeout(mutedHintTimer.current); clearTimeout(copiedHintTimer.current); }, []);"
              s = s.replace(marker, marker + "\n  useEffect(() => { MeetingPiP.setEnabled({ enabled: true }).catch(() => {}); return () => { MeetingPiP.setEnabled({ enabled: false }).catch(() => {}); }; }, []);", 1)
          if 'publishMeetingSession({ credentials, choices, room });' not in s:
              marker = "  useEffect(() => {\n    let cancelled = false;"
              effect = "  useEffect(() => { if (stage === 'room' && credentials && choices) publishMeetingSession({ credentials, choices, room }); }, [stage, credentials, choices, room]);\n\n"
              s = s.replace(marker, effect + marker, 1)
          s = s.replace("  if (stage === 'room' && credentials && choices) return <CallRoom credentials={credentials} choices={choices} room={room} onLeave={handleLeave} />;", "  if (stage === 'room' && credentials && choices) return <div className=\"min-h-[60vh]\" aria-label=\"Meeting connected\" />;", 1)
          if "window.__BLW_MEETING_SESSION__ = null" not in s:
              s = s.replace("  function handleLeave(reason) {", "  function handleLeave(reason) {\n    try { window.__BLW_MEETING_SESSION__ = null; window.dispatchEvent(new Event(MEETING_SESSION_EVENT)); } catch {}", 1)
          p.write_text(s)

          a = Path('client/src/App.jsx')
          text = a.read_text()
          text = text.replace("import { useEffect, useRef, lazy, Suspense } from 'react';", "import { useEffect, useRef, useState, lazy, Suspense } from 'react';", 1)
          if "import { CallRoom } from './pages/Meetings';" not in text:
              text = text.replace("import { useAuth }", "import { CallRoom } from './pages/Meetings';\nimport { useAuth }", 1)
          if "import { Capacitor, registerPlugin } from '@capacitor/core';" not in text:
              text = text.replace("import ErrorBoundary from './components/ErrorBoundary';", "import ErrorBoundary from './components/ErrorBoundary';\nimport { Capacitor, registerPlugin } from '@capacitor/core';", 1)
          if "const MeetingPiP = registerPlugin('MeetingPiP');" not in text:
              text = text.replace('const RouteFallback = () =>', "const MeetingPiP = registerPlugin('MeetingPiP');\n\nconst RouteFallback = () =>", 1)
          if 'function PersistentMeetingOverlay()' not in text:
              overlay = """function PersistentMeetingOverlay() {
  const [session, setSession] = useState(() => { try { return window.__BLW_MEETING_SESSION__ || null; } catch { return null; } });
  useEffect(() => { const sync = () => { try { setSession(window.__BLW_MEETING_SESSION__ || null); } catch {} }; window.addEventListener('blw-meeting-session-change', sync); return () => window.removeEventListener('blw-meeting-session-change', sync); }, []);
  if (!session?.credentials || !session?.choices || !session?.room) return null;
  return <CallRoom credentials={session.credentials} choices={session.choices} room={session.room} onLeave={() => { try { window.__BLW_MEETING_SESSION__ = null; window.dispatchEvent(new Event('blw-meeting-session-change')); } catch {} }} />;
}

"""
              text = text.replace('const AnimatedRoutes = () => {', overlay + 'const AnimatedRoutes = () => {', 1)
          if 'MeetingPiP.enter().catch' not in text:
              nav = "  useEffect(() => { if (location.pathname === '/meetings') return; try { if (Capacitor.isNativePlatform() && window.__BLW_MEETING_SESSION__) MeetingPiP.enter().catch(() => {}); } catch {} }, [location.pathname]);\n"
              text = text.replace('  const navigationType = useNavigationType();', '  const navigationType = useNavigationType();\n' + nav, 1)
          text = text.replace("return <><OfflineBanner /><AnimatedRoutes /><NotificationPermissionPrompt /><UpdateAvailablePrompt /></>;", "return <><PersistentMeetingOverlay /><OfflineBanner /><AnimatedRoutes /><NotificationPermissionPrompt /><UpdateAvailablePrompt /></>;", 1)
          a.write_text(text)

          main = Path('client/android/app/src/main/java/com/blwcampusministry/app/MainActivity.java')
          main.write_text('''package com.blwcampusministry.app;\n\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    private volatile boolean meetingPipEnabled = false;\n\n    public void setMeetingPipEnabled(boolean enabled) { meetingPipEnabled = enabled; }\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        registerPlugin(ApkInstallerPlugin.class);\n        registerPlugin(MeetingPiP.class);\n        super.onCreate(savedInstanceState);\n    }\n\n    @Override\n    public void onUserLeaveHint() {\n        if (meetingPipEnabled && android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O && android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.S) enterPictureInPictureMode();\n        super.onUserLeaveHint();\n    }\n}\n''')
          pip = Path('client/android/app/src/main/java/com/blwcampusministry/app/MeetingPiP.java')
          pip.write_text('''package com.blwcampusministry.app;\n\nimport android.app.Activity;\nimport android.app.PictureInPictureParams;\nimport android.os.Build;\nimport android.util.Rational;\nimport com.getcapacitor.JSObject;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginCall;\nimport com.getcapacitor.annotation.CapacitorPlugin;\n\n@CapacitorPlugin(name = "MeetingPiP")\npublic class MeetingPiP extends Plugin {\n  @PluginMethod public void enter(PluginCall call) { Activity a = getActivity(); a.runOnUiThread(() -> { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) a.enterPictureInPictureMode(); call.resolve(); }); }\n  @PluginMethod public void setEnabled(PluginCall call) { boolean enabled = call.getBoolean("enabled", false); Activity a = getActivity(); a.runOnUiThread(() -> { if (a instanceof MainActivity) ((MainActivity)a).setMeetingPipEnabled(enabled); if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) { PictureInPictureParams.Builder b = new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)); if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) b.setAutoEnterEnabled(enabled); a.setPictureInPictureParams(b.build()); } call.resolve(new JSObject().put("enabled", enabled)); }); }\n}\n''')
          manifest = Path('client/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android:supportsPictureInPicture="true"' not in m:
              m = m.replace('android:exported="true">', 'android:exported="true"\n            android:supportsPictureInPicture="true"\n            android:resizeableActivity="true">', 1)
          manifest.write_text(m)

          for stale in ['.github/workflows/add-pip.yml','.github/workflows/meeting-pip-navigation.yml','.github/workflows/patch-android-pip.yml']:
              q = Path(stale)
              if q.exists(): q.unlink()

      - name: Build client
        working-directory: client
        run: npm ci --no-audit --no-fund && npm run build

      - name: Commit implementation and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-meeting-pip-navigation.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: keep meetings active and enter PiP on navigation'
          git push
