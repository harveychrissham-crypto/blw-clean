name: feed-following-hardening
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Feed following flow
        shell: python
        run: |
          from pathlib import Path

          worker = Path('worker/feed-api.js')
          text = worker.read_text()

          old = "const offset = Math.max(Number.isFinite(rawOffset) ? rawOffset : 0, 0);\n      const client = await getDb(env);"
          new = "const offset = Math.max(Number.isFinite(rawOffset) ? rawOffset : 0, 0);\n      const followingOnly = url.searchParams.get('following') === '1' && Boolean(email);\n      const client = await getDb(env);"
          if old not in text: raise SystemExit('worker marker 1 not found')
          text = text.replace(old, new, 1)

          old = "SELECT * FROM (\n          SELECT CONCAT('s:',s.id) AS id,s.title,s.speaker AS author,s.description AS body,s.youtube_url,NULL::text AS media_url,NULL::text AS media_type,s.created_at,s.is_featured,'sermon' AS type,'sermon' AS source_type,false AS is_user_post,false AS is_owner,0::int AS view_count,"
          new = "SELECT * FROM (\n          SELECT CONCAT('s:',s.id) AS id,s.title,s.speaker AS author,s.description AS body,s.youtube_url,NULL::text AS media_url,NULL::text AS media_type,s.created_at,s.is_featured,'sermon' AS type,'sermon' AS source_type,false AS is_user_post,false AS is_owner,false AS following,NULL::text AS author_email,0::int AS view_count,"
          if old not in text: raise SystemExit('worker sermon marker not found')
          text = text.replace(old, new, 1)

          old = "SELECT CONCAT('p:',p.id) AS id,p.title,p.author_name AS author,p.body,p.youtube_url,p.media_url,p.media_type,p.created_at,false AS is_featured,p.type,'user' AS source_type,true AS is_user_post,\n          CASE WHEN $1 <> '' AND LOWER(p.user_email)=LOWER($1) THEN true ELSE false END AS is_owner,"
          new = "SELECT CONCAT('p:',p.id) AS id,p.title,p.author_name AS author,p.body,p.youtube_url,p.media_url,p.media_type,p.created_at,false AS is_featured,p.type,'user' AS source_type,true AS is_user_post,\n          CASE WHEN $1 <> '' AND LOWER(p.user_email)=LOWER($1) THEN true ELSE false END AS is_owner,\n          CASE WHEN $1 <> '' AND EXISTS(SELECT 1 FROM public.feed_user_follows f WHERE LOWER(f.follower_email)=LOWER($1) AND LOWER(f.followed_email)=LOWER(p.user_email)) THEN true ELSE false END AS following,\n          p.user_email AS author_email,"
          if old not in text: raise SystemExit('worker post marker not found')
          text = text.replace(old, new, 1)

          old = "FROM public.feed_posts p\n        ) feed_items ORDER BY created_at DESC,id DESC LIMIT $2 OFFSET $3`,[email,limit+1,offset,canSeeViews]);"
          new = "FROM public.feed_posts p\n        ) feed_items WHERE $5 = false OR following = true ORDER BY created_at DESC,id DESC LIMIT $2 OFFSET $3`,[email,limit+1,offset,canSeeViews,followingOnly]);"
          if old not in text: raise SystemExit('worker query tail marker not found')
          text = text.replace(old, new, 1)

          marker = "    const viewMatch = url.pathname.match(/^\\/api\\/feed\\/posts\\/([^/]+)\\/view$/);"
          follow_block = """    const followMatch = url.pathname.match(/^\\/api\\/feed\\/users\\/([^/]+)\\/follow$/);\n    if (followMatch && request.method === 'POST') {\n      if (!email) return json({ error:'Sign in required to follow members.' },401,headers);\n      const followedEmail = decodeURIComponent(followMatch[1] || '').trim().toLowerCase();\n      if (!followedEmail || followedEmail === email) return json({ error:'You cannot follow yourself.' },400,headers);\n      const client = await getDb(env);\n      try {\n        const target = await client.query('SELECT 1 FROM public.users WHERE LOWER(email)=LOWER($1) LIMIT 1',[followedEmail]);\n        if (!target.rows.length) return json({ error:'Member not found.' },404,headers);\n        const current = await client.query('SELECT 1 FROM public.feed_user_follows WHERE LOWER(follower_email)=LOWER($1) AND LOWER(followed_email)=LOWER($2) LIMIT 1',[email,followedEmail]);\n        if (current.rows.length) await client.query('DELETE FROM public.feed_user_follows WHERE LOWER(follower_email)=LOWER($1) AND LOWER(followed_email)=LOWER($2)',[email,followedEmail]);\n        else await client.query('INSERT INTO public.feed_user_follows(follower_email,followed_email) VALUES($1,$2) ON CONFLICT DO NOTHING',[email,followedEmail]);\n        const following = !(current.rows.length > 0);\n        return json({ following },200,headers);\n      } finally { await client.end().catch(()=>{}); }\n    }\n"""
          if marker not in text: raise SystemExit('worker follow insertion marker not found')
          text = text.replace(marker, follow_block + marker, 1)
          worker.write_text(text)

          util = Path('client/src/utils/feed.js')
          text = util.read_text()
          old = "    isOwner: Boolean(row.is_owner ?? row.isOwner),\n    viewCount:"
          new = "    isOwner: Boolean(row.is_owner ?? row.isOwner),\n    following: Boolean(row.following),\n    authorEmail: row.author_email || row.user_email || '',\n    viewCount:"
          if old not in text: raise SystemExit('utils normalize marker not found')
          text = text.replace(old, new, 1)
          old = "export async function fetchFeed({ limit = 20, offset = 0 } = {}) {\n  const params = new URLSearchParams({ limit: String(limit), offset: String(offset) });"
          new = "export async function fetchFeed({ limit = 20, offset = 0, followingOnly = false } = {}) {\n  const params = new URLSearchParams({ limit: String(limit), offset: String(offset) });\n  if (followingOnly) params.set('following', '1');"
          if old not in text: raise SystemExit('utils fetch marker not found')
          text = text.replace(old, new, 1)
          insert_before = "export const toggleLike = (id) => postAction(id, 'like');\nexport const toggleSave = (id) => postAction(id, 'save');\n"
          follow_fn = insert_before + "\nexport async function toggleFollow(email) {\n  const target = String(email || '').trim();\n  if (!target) throw new Error('Member not found.');\n  const response = await apiFetch(`/api/feed/users/${encodeURIComponent(target)}/follow`, { method: 'POST' });\n  const result = await response.json().catch(() => ({}));\n  if (!response.ok) throw new Error(result?.error || 'Unable to update follow status.');\n  return result;\n}\n"
          if insert_before not in text: raise SystemExit('utils action marker not found')
          text = text.replace(insert_before, follow_fn, 1)
          util.write_text(text)

          feed = Path('client/src/pages/Feed.jsx')
          text = feed.read_text()
          old = "import { fetchFeed, toggleLike, toggleSave, fetchComments, addComment, deleteComment, reportPost, readCachedFeed, writeCachedFeed, recordFeedView } from '../utils/feed';"
          new = "import { fetchFeed, toggleLike, toggleSave, toggleFollow, fetchComments, addComment, deleteComment, reportPost, readCachedFeed, writeCachedFeed, recordFeedView } from '../utils/feed';"
          if old not in text: raise SystemExit('Feed import marker not found')
          text = text.replace(old, new, 1)

          old = "function PostCard({post,user,onUpdate,notificationId}) {\n  const [comments,setComments]=useState(false);"
          new = "function PostCard({post,user,onUpdate,notificationId}) {\n  const [comments,setComments]=useState(false); const [followBusy,setFollowBusy]=useState(false);"
          if old not in text: raise SystemExit('PostCard state marker not found')
          text = text.replace(old, new, 1)

          old = "  const doubleTap=useDoubleTap(like);\n  const previewSource=post.mediaUrl||post.image||'';"
          new = "  const doubleTap=useDoubleTap(like);\n  const follow=async()=>{if(!user||!post.authorEmail||post.isOwner||followBusy)return;setFollowBusy(true);const next=!post.following;onUpdate(post.id,{following:next});try{const r=await toggleFollow(post.authorEmail);onUpdate(post.id,r);hapticSuccess();}catch{onUpdate(post.id,{following:!next});hapticError();}finally{setFollowBusy(false);}};\n  const previewSource=post.mediaUrl||post.image||'';"
          if old not in text: raise SystemExit('PostCard follow marker not found')
          text = text.replace(old, new, 1)

          old = "<p className=\"max-w-[15rem] truncate text-sm font-bold\">{post.author}{post.isOfficial&&<span className=\"ml-1 inline-flex h-3.5 w-3.5 items-center justify-center rounded-full bg-white text-[9px] text-ink-950\" aria-label=\"Official ministry\">✓</span>}</p>"
          new = "<div className=\"flex min-w-0 items-center gap-2\"><p className=\"max-w-[15rem] truncate text-sm font-bold\">{post.author}{post.isOfficial&&<span className=\"ml-1 inline-flex h-3.5 w-3.5 items-center justify-center rounded-full bg-white text-[9px] text-ink-950\" aria-label=\"Official ministry\">✓</span>}</p>{post.isUserPost&&!post.isOwner&&post.authorEmail&&<button type=\"button\" onClick={follow} disabled={followBusy} className=\"shrink-0 text-[10px] font-bold text-white/70 hover:text-white disabled:opacity-40\">{post.following?'Following':'Follow'}</button>}</div>"
          if old not in text: raise SystemExit('PostCard header marker not found')
          text = text.replace(old, new, 1)

          old = "  const loadFirst=useCallback(async({silent=false}={})=>{if(!silent)setLoading(true);setError('');try{const result=await fetchFeed({limit:PAGE_SIZE,offset:0});"
          new = "  const loadFirst=useCallback(async({silent=false}={})=>{if(!silent)setLoading(true);setError('');try{const result=await fetchFeed({limit:PAGE_SIZE,offset:0,followingOnly:tab==='Following'});"
          if old not in text: raise SystemExit('Feed loadFirst marker not found')
          text = text.replace(old, new, 1)

          old = "  const loadMore=useCallback(async()=>{if(loading||loadingMore||!hasMore||messagesOpen)return;setLoadingMore(true);try{const result=await fetchFeed({limit:PAGE_SIZE,offset:posts.length});"
          new = "  const loadMore=useCallback(async()=>{if(loading||loadingMore||!hasMore||messagesOpen)return;setLoadingMore(true);try{const result=await fetchFeed({limit:PAGE_SIZE,offset:posts.length,followingOnly:tab==='Following'});"
          if old not in text: raise SystemExit('Feed loadMore marker not found')
          text = text.replace(old, new, 1)

          old = "  },[loading,loadingMore,hasMore,messagesOpen,posts.length]);"
          new = "  },[loading,loadingMore,hasMore,messagesOpen,posts.length,tab]);"
          if old not in text: raise SystemExit('Feed loadMore deps marker not found')
          text = text.replace(old, new, 1)

          old = "  useEffect(()=>{if(messagesOpen)return;const cached=readCachedFeed();if(cached.length){setPosts(cached.map(normalize));setLoading(false);}loadFirst({silent:Boolean(cached.length)});},[loadFirst,messagesOpen]);"
          new = "  useEffect(()=>{if(messagesOpen)return;if(tab==='All'){const cached=readCachedFeed();if(cached.length){setPosts(cached.map(normalize));setLoading(false);}loadFirst({silent:Boolean(cached.length)});}else{setPosts([]);setHasMore(true);loadFirst();}},[loadFirst,messagesOpen,tab]);"
          if old not in text: raise SystemExit('Feed initial load marker not found')
          text = text.replace(old, new, 1)

          old = "function normalize(post,index=0){return {...post,id:post.id??`post-${index}`,type:post.type||'post',title:post.title||post.body||'Untitled',body:post.body||'',author:post.author||'BLW Kenya Zone',avatarUrl:post.avatarUrl||post.avatar_url||'',time:post.time||'',likeCount:Number(post.likeCount??post.like_count??0),commentCount:Number(post.commentCount??post.comment_count??0),saveCount:Number(post.saveCount??post.save_count??0),viewCount:Number(post.viewCount??post.view_count??0),isOwner:Boolean(post.isOwner??post.is_owner),liked:Boolean(post.liked),saved:Boolean(post.saved),following:post.following===true||post.following==='true',isOfficial:Boolean(post.isOfficial??post.is_official),sourceType:post.sourceType||post.source_type||'',isUserPost:Boolean(post.isUserPost??post.is_user_post),recentLikers:Array.isArray(post.recentLikers)?post.recentLikers:Array.isArray(post.recent_likers)?post.recent_likers:[]};}"
          new = "function normalize(post,index=0){return {...post,id:post.id??`post-${index}`,type:post.type||'post',title:post.title||post.body||'Untitled',body:post.body||'',author:post.author||'BLW Kenya Zone',authorEmail:post.authorEmail||post.author_email||post.user_email||'',avatarUrl:post.avatarUrl||post.avatar_url||'',time:post.time||'',likeCount:Number(post.likeCount??post.like_count??0),commentCount:Number(post.commentCount??post.comment_count??0),saveCount:Number(post.saveCount??post.save_count??0),viewCount:Number(post.viewCount??post.view_count??0),isOwner:Boolean(post.isOwner??post.is_owner),liked:Boolean(post.liked),saved:Boolean(post.saved),following:post.following===true||post.following==='true',isOfficial:Boolean(post.isOfficial??post.is_official),sourceType:post.sourceType||post.source_type||'',isUserPost:Boolean(post.isUserPost??post.is_user_post),recentLikers:Array.isArray(post.recentLikers)?post.recentLikers:Array.isArray(post.recent_likers)?post.recent_likers:[]};}"
          if old not in text: raise SystemExit('Feed normalize marker not found')
          text = text.replace(old, new, 1)
          feed.write_text(text)
      - name: Build client
        run: npm --prefix client install --no-audit --no-fund && npm --prefix client run build
      - name: Commit source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/feed-api.js client/src/utils/feed.js client/src/pages/Feed.jsx supabase/migrations/20260911223000_create_feed_user_follows.sql
          git commit -m "feat: back Feed Following with real follows" || exit 0
          git push origin main
