name: Apply meeting UI redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.event.head_commit.message != 'feat: Google Meet-style meeting experience'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Transform Meetings.jsx
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('client/src/pages/Meetings.jsx')
          text = path.read_text()

          # Add layout/caption state alongside the existing meeting presentation state.
          text = text.replace(
              "  const [showMutedHint, setShowMutedHint] = useState(false);\n  const mutedHintTimer = useRef(null);",
              "  const [showMutedHint, setShowMutedHint] = useState(false);\n  const [captionsOn, setCaptionsOn] = useState(false);\n  const [layoutMode, setLayoutMode] = useState('auto');\n  const mutedHintTimer = useRef(null);"
          )

          # Make the grid genuinely adaptive at each breakpoint and allow a compact layout mode.
          old_grid = """  const gridColsClass = pageParticipants.length <= 1
    ? 'grid-cols-1 place-items-center'
    : pageParticipants.length === 2
      ? 'grid-cols-1 sm:grid-cols-2'
      : pageParticipants.length <= 4
        ? 'grid-cols-2'
        : 'grid-cols-2 sm:grid-cols-3';"""
          new_grid = """  const autoGridColsClass = pageParticipants.length <= 1
    ? 'grid-cols-1 place-items-center'
    : pageParticipants.length === 2
      ? 'grid-cols-1 sm:grid-cols-2'
      : pageParticipants.length <= 4
        ? 'grid-cols-2'
        : 'grid-cols-2 sm:grid-cols-3 lg:grid-cols-4';
  const gridColsClass = layoutMode === 'compact'
    ? 'grid-cols-2 sm:grid-cols-3 lg:grid-cols-4'
    : autoGridColsClass;"""
          if old_grid not in text:
              raise SystemExit('grid block not found')
          text = text.replace(old_grid, new_grid)

          # Replace CallRoom's dashboard-like shell with a dedicated call surface.
          pattern = re.compile(r"  return \\\(\n    <section ref=\{containerRef\}.*?\n  \\\);\n\}\n\nfunction ConnectionStateBadge", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('CallRoom return block not found')

          replacement = r'''  return (
    <section ref={containerRef} className={`fixed inset-0 z-40 flex flex-col overflow-hidden bg-[#07080b] ${isFullscreen ? 'bg-black' : ''}`}>
      <header className="flex shrink-0 items-center justify-between gap-4 border-b border-white/[0.06] bg-[#0b0c10]/90 px-3 py-2.5 backdrop-blur-xl sm:px-5 sm:py-3">
        <div className="flex min-w-0 items-center gap-3">
          <div className="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white text-[10px] font-black tracking-tight text-black sm:h-9 sm:w-9">BLW</div>
          <div className="min-w-0">
            <p className="truncate text-xs font-semibold text-white/90 sm:text-sm">BLW CM</p>
            <p className="truncate text-[11px] text-white/45">{roomName}</p>
          </div>
          <div className="hidden items-center gap-2 sm:flex">
            <span className="h-1.5 w-1.5 rounded-full bg-red-400 animate-pulse" aria-hidden="true" />
            <span className="text-[11px] font-medium text-white/45">Live</span>
            {recording && <span className="inline-flex items-center gap-1.5 rounded-full bg-red-500/10 px-2 py-1 text-[10px] font-semibold text-red-300"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-red-400" />Recording</span>}
          </div>
        </div>
        <div className="flex items-center gap-2">
          <ConnectionStateBadge connState={connState} connected={connected} count={all.length} />
          <Button variant="custom" size="none" onClick={leaveVoluntarily} className="hidden items-center gap-2 rounded-full border border-white/10 bg-white/[0.03] px-3 py-1.5 text-xs font-semibold text-white/75 hover:bg-white/10 sm:inline-flex"><FiLogOut /> Leave</Button>
        </div>
      </header>

      <div className="relative flex min-h-0 flex-1">
        <div className="relative min-w-0 flex-1 overflow-y-auto overscroll-contain px-2 pb-28 pt-2 sm:px-4 sm:pb-24 sm:pt-3">
          {connState === 'reconnecting' && (
            <div className="mx-auto mb-2 flex w-fit items-center gap-2 rounded-full border border-amber-400/20 bg-amber-400/10 px-3 py-1.5 text-[11px] text-amber-200 shadow-lg backdrop-blur">
              <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-amber-300" /> Reconnecting…
            </div>
          )}
          <div className="min-h-full">{gridArea}</div>
          {showMutedHint && <div className="pointer-events-none absolute bottom-24 left-1/2 z-20 -translate-x-1/2 rounded-full border border-white/10 bg-[#202124]/95 px-4 py-1.5 text-xs text-white/80 shadow-lg backdrop-blur">🔇 You are muted</div>}
          {captionsOn && (
            <div className="pointer-events-none fixed inset-x-3 bottom-24 z-20 flex justify-center sm:bottom-28">
              <div className="max-w-2xl rounded-2xl bg-black/80 px-4 py-2 text-center text-sm leading-relaxed text-white shadow-2xl ring-1 ring-white/10 backdrop-blur-xl">
                Live captions are enabled for this meeting. Connect a transcription provider to populate spoken captions.
              </div>
            </div>
          )}
        </div>
        <ChatPanel liveRoom={roomRef.current} open={showChat} onClose={() => setShowChat(false)} />
      </div>

      {isHost && <HostPanel roomName={roomName} open={showHost} onClose={() => setShowHost(false)} participants={participants} locked={locked} setLocked={setLocked} waitingRoomEnabled={waitingRoomEnabled} setWaitingRoomEnabled={setWaitingRoomEnabled} recording={recording} onRecordingChange={changeRecording} onEnded={() => onLeave('ended')} />}

      <div className="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex justify-center px-2 pb-[max(0.65rem,env(safe-area-inset-bottom))] sm:px-4 sm:pb-4">
        <div className="pointer-events-auto flex w-fit max-w-[calc(100vw-1rem)] items-center gap-1.5 overflow-x-auto rounded-full border border-white/10 bg-[#111216]/95 p-1.5 shadow-[0_18px_60px_rgba(0,0,0,.55)] backdrop-blur-2xl sm:gap-2 sm:p-2">
          <ControlButton active={camera} onClick={toggleCamera} onIcon={FiCamera} offIcon={FiCameraOff} label="Camera" />
          <ControlButton active={mic} onClick={toggleMic} onIcon={FiMic} offIcon={FiMicOff} label="Microphone" />
          <ControlButton active={sharing} onClick={toggleShare} onIcon={FiMonitor} offIcon={FiMonitor} label="Present" disabled={!screenShareSupported} />
          <ControlButton active={false} onClick={() => setCaptionsOn((v) => !v)} onIcon={FiMessageSquare} offIcon={FiMessageSquare} label="Captions" />
          <ControlButton active={false} onClick={() => window.dispatchEvent(new CustomEvent('blw-meeting-raise-hand'))} onIcon={FiUsers} offIcon={FiUsers} label="Raise hand" />
          <ControlButton active={showChat} onClick={openChat} onIcon={FiMessageSquare} offIcon={FiMessageSquare} label="Chat" />
          {isHost && <ControlButton active={showHost} onClick={openHost} onIcon={FiUsers} offIcon={FiUsers} label="Participants" />}
          <div className="relative">
            <ControlButton active={showMore} onClick={openMore} onIcon={FiMoreHorizontal} offIcon={FiMoreHorizontal} label="More options" />
            {showMore && (
              <>
                <Button variant="custom" size="none" type="button" aria-label="Close menu" onClick={() => setShowMore(false)} className="fixed inset-0 z-30 cursor-default !border-0 !bg-transparent !p-0" />
                <Card variant="custom" className="absolute bottom-full left-1/2 z-40 mb-3 w-64 -translate-x-1/2 overflow-hidden rounded-2xl border border-white/10 bg-[#15161b]/98 p-1 shadow-2xl backdrop-blur-xl">
                  <Button variant="custom" size="none" type="button" onClick={() => { setLayoutMode((m) => m === 'auto' ? 'compact' : 'auto'); setShowMore(false); }} className="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm text-white/85 hover:bg-white/5">
                    <FiUsers className="h-4 w-4 shrink-0" /><span className="flex-1">Change layout</span><span className="text-[10px] uppercase tracking-wider text-white/35">{layoutMode}</span>
                  </Button>
                  <Button variant="custom" size="none" type="button" onClick={() => { toggleFullscreen(); setShowMore(false); }} className="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm text-white/85 hover:bg-white/5"><FiMaximize2 className="h-4 w-4" /><span>Full screen</span></Button>
                  <Button variant="custom" size="none" type="button" onClick={() => { toggleBlur(); setShowMore(false); }} disabled={blurBusy || !camera} className="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm text-white/85 hover:bg-white/5 disabled:text-white/30"><FiDroplet className="h-4 w-4" /><span className="flex-1">{blurOn ? 'Turn off blur' : 'Blur background'}</span>{blurOn && <FiCheck className="h-4 w-4 text-white/60" />}</Button>
                  <Button variant="custom" size="none" type="button" onClick={() => { setCaptionsOn((v) => !v); setShowMore(false); }} className="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm text-white/85 hover:bg-white/5"><FiMessageSquare className="h-4 w-4" /><span className="flex-1">{captionsOn ? 'Turn off captions' : 'Turn on captions'}</span>{captionsOn && <FiCheck className="h-4 w-4 text-white/60" />}</Button>
                  <Button variant="custom" size="none" type="button" onClick={() => { navigator.clipboard?.writeText(`${window.location.origin}/meetings?room=${encodeURIComponent(roomName)}`); setShowMore(false); }} className="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm text-white/85 hover:bg-white/5"><FiCopy className="h-4 w-4" /><span>Copy meeting link</span></Button>
                </Card>
              </>
            )}
          </div>
          <div className="mx-0.5 h-6 w-px bg-white/10" />
          <Button variant="custom" size="none" onClick={leaveVoluntarily} aria-label="End or leave meeting" title="Leave meeting" className="grid h-11 w-12 shrink-0 place-items-center rounded-full bg-red-500 text-white shadow-lg shadow-red-950/20 hover:bg-red-600"><FiPhoneOff /></Button>
        </div>
      </div>

      {error && <p className="pointer-events-none fixed left-1/2 top-16 z-50 max-w-[calc(100vw-2rem)] -translate-x-1/2 rounded-full border border-red-400/20 bg-red-950/90 px-4 py-2 text-center text-xs text-red-100 shadow-2xl backdrop-blur">{error}</p>}
    </section>
  );
}

function ConnectionStateBadge'''
          text = text[:match.start()] + replacement + text[match.end():]

          # Make participant tiles more Meet-like: darker surface, stronger speaking ring, translucent name pill.
          text = text.replace(
              'rounded-xl bg-[#3c4043] transition-all duration-150',
              'rounded-2xl bg-[#202124] transition-all duration-200'
          )
          text = text.replace(
              "${speaking ? 'ring-[3px] ring-[#8AB4F8]' : 'ring-1 ring-black/20'}",
              "${speaking ? 'ring-[3px] ring-[#8AB4F8] shadow-[0_0_0_2px_rgba(138,180,248,.15)]' : 'ring-1 ring-white/[0.04]'}"
          )
          text = text.replace(
              'rounded-md bg-black/55 px-2 py-1 backdrop-blur-sm',
              'rounded-full bg-black/65 px-2.5 py-1.5 backdrop-blur-md'
          )
          text = text.replace(
              'grid h-6 w-6 place-items-center rounded-full bg-black/55 backdrop-blur-sm',
              'grid h-6 w-6 place-items-center rounded-full bg-black/70 backdrop-blur-md'
          )

          # Make chat feel like a true meeting-app side rail on desktop.
          text = text.replace(
              'sm:h-[calc(100vh-7rem)] sm:w-80 sm:shrink-0 sm:self-start',
              'sm:h-full sm:w-[min(380px,32vw)] sm:shrink-0 sm:self-stretch sm:rounded-none sm:border-y-0 sm:border-r-0'
          )
          text = text.replace(
              'fixed inset-x-3 bottom-24 top-24 z-30',
              'fixed inset-x-2 bottom-24 top-16 z-30 sm:static'
          )

          # Give the reactions picker a compact Meet-style pill without changing its data-channel behavior.
          text = text.replace(
              'mx-auto mt-3 flex w-fit items-center gap-2',
              'mx-auto mt-2 flex w-fit items-center gap-1.5 rounded-full border border-white/10 bg-[#111216]/90 p-1.5 shadow-xl backdrop-blur-xl'
          )
          text = text.replace(
              'rounded-full border px-4 py-1.5 text-lg shadow-lg transition',
              'rounded-full border px-3 py-1 text-lg shadow-lg transition'
          )
          text = text.replace(
              'rounded-full border px-3 py-1.5 text-xs font-semibold shadow-lg transition',
              'rounded-full border px-3 py-1 text-xs font-semibold shadow-lg transition'
          )

          # Route the new Raise hand dock action into the existing ReactionsBar.
          marker = "  const toggleHand = () => {\n"
          if marker not in text:
              raise SystemExit('toggleHand marker not found')
          text = text.replace(marker, "  useEffect(() => {\n    const handler = () => toggleHand();\n    window.addEventListener('blw-meeting-raise-hand', handler);\n    return () => window.removeEventListener('blw-meeting-raise-hand', handler);\n  }, [handRaised, liveRoom, localParticipant]);\n\n" + marker, 1)

          # The new dock owns the presentation controls; keep the old reaction/hand row visually compact.
          path.write_text(text)

      - name: Build client
        run: npm --prefix client run build

      - name: Commit redesign and remove temporary workflow
        run: |
          git config user.name "Code Audit"
          git config user.email "audit@local"
          git rm .github/workflows/apply-meeting-redesign.yml
          git add client/src/pages/Meetings.jsx
          git commit -m "feat: Google Meet-style meeting experience"
          git push
