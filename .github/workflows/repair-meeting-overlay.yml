name: Repair meeting reaction overlay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: repair meeting reaction overlay') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair meeting reaction backdrop
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/pages/Meetings.jsx')
          text = path.read_text(encoding='utf-8')
          needle = 'className="fixed inset-0 z-30 cursor-default"'
          replacement = 'className="fixed inset-0 z-30 cursor-default !bg-transparent !border-0 !p-0"'

          count = text.count(needle)
          if count == 0:
              raise SystemExit('Expected meeting overlay class was not found.')

          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          print(f'Repaired {count} meeting backdrop overlay(s).')

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Meetings.jsx
          git rm .github/workflows/repair-meeting-overlay.yml
          git commit -m "fix: repair meeting reaction overlay"
          git push

# One-shot repair workflow; self-removes after applying the fix.